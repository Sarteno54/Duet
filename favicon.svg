<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <clipPath id="card"><rect width="1024" height="1024" rx="232" ry="232"/></clipPath>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1450"/><stop offset="1" stop-color="#07070f"/></linearGradient>
  <radialGradient id="gV" cx="0.15" cy="0.05" r="0.85"><stop offset="0" stop-color="#7c6cff" stop-opacity=".95"/><stop offset="1" stop-color="#7c6cff" stop-opacity="0"/></radialGradient>
  <radialGradient id="gP" cx="1" cy="0.02" r="0.75"><stop offset="0" stop-color="#ff7ad9" stop-opacity=".6"/><stop offset="1" stop-color="#ff7ad9" stop-opacity="0"/></radialGradient>
  <radialGradient id="gT" cx="0.5" cy="1.12" r="0.85"><stop offset="0" stop-color="#2ee6c5" stop-opacity=".5"/><stop offset="1" stop-color="#2ee6c5" stop-opacity="0"/></radialGradient>
  <linearGradient id="gA" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#7af7de"/><stop offset="1" stop-color="#12ad98"/></linearGradient>
  <linearGradient id="gB" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#ffbf9c"/><stop offset="1" stop-color="#ff5f43"/></linearGradient>
  <linearGradient id="lens" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9d0ff"/></linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="inB"><circle cx="602" cy="512" r="268"/></clipPath>
  <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<g clip-path="url(#card)">
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#gV)"/>
  <rect width="1024" height="1024" fill="url(#gP)"/>
  <rect width="1024" height="1024" fill="url(#gT)"/>
  <g transform="translate(512 512) scale(1.05) translate(-512 -512)">
    <ellipse cx="512" cy="812" rx="300" ry="38" fill="#000" opacity=".3" filter="url(#blur)"/>
    <circle cx="422" cy="512" r="268" fill="#2ee6c5" opacity=".45" filter="url(#glow)"/>
    <circle cx="602" cy="512" r="268" fill="#ff7a52" opacity=".45" filter="url(#glow)"/>
    <circle cx="422" cy="512" r="268" fill="url(#gA)"/>
    <circle cx="602" cy="512" r="268" fill="url(#gB)" opacity=".96"/>
    <circle cx="422" cy="512" r="268" fill="url(#lens)" clip-path="url(#inB)"/>
    <circle cx="422" cy="512" r="262" fill="none" stroke="url(#rim)" stroke-width="10"/>
    <circle cx="602" cy="512" r="262" fill="none" stroke="url(#rim)" stroke-width="10"/>
  </g>
</g>
</svg>