<style>
/* ---------------------------------------------------------------------
   Duet · hoja de estilos única.
   Dirección: panel financiero nocturno para dos personas. Capas oscuras
   (bg < surface < surface-2), una tarjeta héroe con degradado vivo y
   barras flotantes de cristal abajo. Cada perfil tiene su acento (verde
   agua / coral) y la cuenta conjunta el violeta que los une.
   Tipografía: Bricolage Grotesque (titulares), Public Sans (texto),
   Space Mono tabular (cifras: deben alinearse como en una calculadora).
   Layout: una columna de 520px; abajo, de arriba a abajo: registro
   rápido (flotante) y pestañas (flotantes), ambos fijos en todas las
   secciones.
--------------------------------------------------------------------- */

/* ---------- tokens ---------- */
:root{
  --bg:#05060a; --surface:#0e1118; --surface-2:#161a24; --border:rgba(255,255,255,.07);
  --fg:#f3f5fa; --fg-muted:#98a1b5; --fg-faint:#5d667b;
  --accent-a:#2ee6c5; --accent-a-ink:#06201c;
  --accent-b:#ff8a5c; --accent-b-ink:#2b1206;
  --accent-joint:#7c6cff; --accent-joint-ink:#18123a;
  --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
  --grad:linear-gradient(135deg,#7c6cff,#c06cff);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -22px rgba(0,0,0,.7);
  --bar-bg:rgba(14,17,24,.82);
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'Public Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'Space Mono',ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f4f9; --surface:#ffffff; --surface-2:#eef0f6; --border:rgba(20,24,40,.08);
    --fg:#171a21; --fg-muted:#5c6474; --fg-faint:#9aa1ad;
    --accent-a:#0f9d91; --accent-a-ink:#e7fbf8;
    --accent-b:#e2642a; --accent-b-ink:#fff1e8;
    --accent-joint:#6a53f0; --accent-joint-ink:#f1eeff;
    --shadow:0 1px 2px rgba(20,24,40,.04),0 14px 34px -20px rgba(40,50,90,.28);
    --bar-bg:rgba(255,255,255,.86);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f4f9; --surface:#ffffff; --surface-2:#eef0f6; --border:rgba(20,24,40,.08);
  --fg:#171a21; --fg-muted:#5c6474; --fg-faint:#9aa1ad;
  --accent-a:#0f9d91; --accent-a-ink:#e7fbf8;
  --accent-b:#e2642a; --accent-b-ink:#fff1e8;
  --accent-joint:#6a53f0; --accent-joint-ink:#f1eeff;
  --shadow:0 1px 2px rgba(20,24,40,.04),0 14px 34px -20px rgba(40,50,90,.28);
  --bar-bg:rgba(255,255,255,.86);
  color-scheme:light;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%}
/* modo app: los márgenes seguros ya los gestiona la propia interfaz; sin rebotes ni selección accidental */
:root{padding-top:0; padding-bottom:0}
html,body{overscroll-behavior-y:none; -webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent; -webkit-touch-callout:none}
button,.tab,.pill,.chip,.qchip,.key{-webkit-user-select:none; user-select:none; touch-action:manipulation}
input,textarea{-webkit-user-select:text; user-select:text}
body{
  margin:0; color:var(--fg);
  background:var(--bg);
  font-family:var(--font-body); font-size:15.5px; line-height:1.5; letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
h1,h2,h3{font-family:var(--font-display); margin:0; text-wrap:balance; letter-spacing:-.025em}
section h2{font-size:19px; font-weight:700}
.num{font-family:var(--font-mono); font-variant-numeric:tabular-nums}
button{font-family:inherit}
input,select{font-family:inherit; font-size:16px}
::selection{background:var(--accent-joint); color:#fff}
a{color:inherit}
svg{display:block}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#liquid{position:fixed; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none}

/* ---------- utilidades ---------- */
.muted{color:var(--fg-muted)}
.faint{color:var(--fg-faint)}
.hidden{display:none!important}
.row{display:flex; align-items:center; gap:10px}
.row > svg{width:18px; height:18px; flex-shrink:0}
.col{display:flex; flex-direction:column; gap:10px}
.spread{display:flex; align-items:center; justify-content:space-between; gap:10px}
.card{
  background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 92%,#fff 8%),var(--surface));
  border:1px solid var(--border); border-radius:24px; padding:18px; box-shadow:var(--shadow);
}
.mini-ic{display:inline-flex; width:12px; height:12px; vertical-align:-1px; flex-shrink:0}
.mini-ic svg{width:100%; height:100%; display:block}
.btn{
  appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:14px; padding:13px 18px; font-weight:700; font-size:14px; cursor:pointer; color:var(--fg);
  background:var(--surface-2); border:1px solid var(--border);
  transition:transform .12s ease, filter .2s;
}
.btn svg{width:16px; height:16px; flex-shrink:0}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad); color:#fff; border-color:transparent; box-shadow:0 10px 24px -10px var(--accent-joint)}
.btn-ghost{background:transparent; border-color:transparent; color:var(--fg-muted)}
.btn-ghost svg{width:17px; height:17px}
.btn-block{width:100%}
.btn-row{display:flex; gap:8px; flex-wrap:wrap}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:11px; font-weight:700; color:var(--fg-muted); text-transform:uppercase; letter-spacing:.1em}
.field input, .field select, .field textarea, .nl-row input{
  background:var(--surface-2); border:1px solid var(--border); color:var(--fg);
  border-radius:14px; padding:13px 14px; width:100%; transition:border-color .2s, box-shadow .2s;
}
.field input:focus, .field select:focus, .field textarea:focus, .nl-row input:focus{
  outline:none; border-color:var(--accent-joint);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent-joint) 22%,transparent);
}
.segmented{display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:16px; padding:4px; gap:3px}
.segmented button{
  flex:1; border:none; background:transparent; color:var(--fg-muted); padding:10px 6px;
  border-radius:12px; font-weight:700; font-size:13px; cursor:pointer; transition:all .2s;
}
.segmented button.active, .qb-seg button.active{background:var(--grad); color:#fff; box-shadow:0 6px 16px -8px var(--accent-joint)}
.chip{
  border:1px solid var(--border); background:var(--surface-2); color:var(--fg-muted);
  border-radius:999px; padding:9px 15px; font-size:13px; font-weight:600; cursor:pointer; transition:all .2s;
}
.chip.active{background:var(--fg); color:var(--bg); border-color:var(--fg)}

/* ---------- estructura ---------- */
#app{display:flex; flex-direction:column; min-height:100%; width:100%; max-width:520px; margin:0 auto; flex:1}
#appwrap{position:relative; max-width:520px; margin:0 auto; width:100%}
.topbar{
  padding-top:max(14px, env(safe-area-inset-top,0px)); padding-bottom:14px;
  display:flex; align-items:center; justify-content:space-between;
}
.brand{display:flex; align-items:center; gap:10px}
.brand .mark{width:32px; height:32px; display:flex; align-items:center; justify-content:center; flex-shrink:0}
.brand .mark svg{width:32px; height:32px}
.brand span{font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:-.03em}
#btn-theme{padding:8px; border-radius:999px; border:1px solid var(--border); color:var(--fg-muted); cursor:pointer}
#btn-theme svg{width:18px; height:18px}
.profile-chip{
  display:flex; align-items:center; gap:7px; cursor:pointer; color:var(--fg);
  background:color-mix(in srgb,var(--surface) 80%,transparent); backdrop-filter:blur(12px);
  border:1px solid var(--border); box-shadow:var(--shadow); padding:6px 12px 6px 6px; border-radius:999px;
}
.avatar{width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0; box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--border)}
.avatar svg{width:13px; height:13px}
main{flex:1; overflow-y:auto}
.screen{display:flex; flex-direction:column; gap:16px; padding-bottom:200px}
.screen.enter{animation:fade .35s ease both}
.section-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px}
.section-head h2{white-space:nowrap}

/* ---------- barras flotantes (registro rápido + pestañas) ---------- */
.tabbar, .quickbar{
  position:fixed; left:50%; transform:translateX(-50%);
  width:calc(100% - 24px); max-width:496px; margin:0; z-index:30;
  background:var(--bar-bg); border:1px solid var(--border);
  backdrop-filter:blur(22px) saturate(1.5); -webkit-backdrop-filter:blur(22px) saturate(1.5);
}
.tabbar{
  bottom:calc(6px + env(safe-area-inset-bottom,0px));
  display:flex; justify-content:space-around; padding:7px; border-radius:30px;
  box-shadow:0 18px 40px -14px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.05) inset;
}
.tab{
  border:none; background:transparent; color:var(--fg-faint); display:flex; flex-direction:column;
  align-items:center; gap:4px; font-size:10.5px; font-weight:700; padding:9px 2px; cursor:pointer;
  letter-spacing:.01em; flex:1; border-radius:22px; transition:all .25s;
}
.tab svg{width:23px; height:23px}
.tab.active{background:var(--grad); color:#fff; box-shadow:0 10px 22px -10px var(--accent-joint)}
.quickbar{
  bottom:calc(88px + env(safe-area-inset-bottom,0px));
  padding:8px 10px; border-radius:22px; box-shadow:var(--shadow);
}
.nl-row{display:flex; gap:8px}
.nl-row input{flex:1; min-width:0; padding:10px 14px; font-size:15px}
.nl-btn{
  flex-shrink:0; width:42px; height:42px; border-radius:14px; border:1px solid var(--border); cursor:pointer;
  display:grid; place-items:center; background:var(--surface-2); color:var(--fg-muted);
}
.nl-btn svg{width:18px; height:18px}
.nl-btn.primary{background:var(--grad); color:#fff; border-color:transparent; box-shadow:0 8px 18px -8px var(--accent-joint)}
.qb-pills{display:flex; align-items:center; gap:6px; margin-top:8px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.qb-pills::-webkit-scrollbar{display:none}
.qb-seg{display:flex; flex-shrink:0; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:2px; gap:2px}
.qb-seg button{border:none; background:transparent; color:var(--fg-muted); padding:5px 11px; border-radius:999px; font-weight:700; font-size:11.5px; cursor:pointer}
.pill{
  flex-shrink:0; display:flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap;
  border:1px solid var(--border); background:var(--surface-2); color:var(--fg);
  border-radius:999px; padding:5px 11px 5px 6px; font-size:12px; font-weight:700;
}
.pill .ic{width:20px; height:20px; border-radius:50%; display:grid; place-items:center}
.pill .ic svg{width:11px; height:11px}
.pill small{color:var(--fg-muted); font-weight:600; font-family:var(--font-mono); font-size:11px}
.pill.ghost{color:var(--fg-muted); padding:5px 11px; background:transparent; border-style:dashed}
/* ocultar / mostrar el registro rápido */
.qb-bottom{display:flex; align-items:center; gap:6px; margin-top:8px}
.qb-bottom .qb-pills{flex:1; min-width:0; margin-top:0}
.qb-hide{
  flex-shrink:0; width:30px; height:30px; border-radius:50%; border:1px solid var(--border); cursor:pointer;
  display:grid; place-items:center; background:var(--surface-2); color:var(--fg-muted);
}
.qb-hide svg{width:16px; height:16px}
.qb-hide:hover{color:var(--fg)}
.qb-fab-wrap{
  position:fixed; left:50%; transform:translateX(-50%); z-index:30; pointer-events:none;
  width:calc(100% - 24px); max-width:496px; display:flex; justify-content:flex-end;
  bottom:calc(88px + env(safe-area-inset-bottom,0px));
}
.qb-fab{
  pointer-events:auto; display:flex; align-items:center; gap:8px; cursor:pointer; border:1px solid transparent;
  background:var(--grad); color:#fff; font-weight:700; font-size:13px; padding:11px 16px 11px 13px; border-radius:999px;
  box-shadow:0 12px 26px -10px var(--accent-joint); animation:fade .25s ease both;
}
.qb-fab svg{width:18px; height:18px}
.qb-fab:active{transform:scale(.96)}
.screen.qb-off{padding-bottom:150px}
body.qb-hidden .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
body.qb-hidden .toast-alert{bottom:calc(206px + env(safe-area-inset-bottom,0px))}

/* ---------- héroe y tarjetas de cifras ---------- */
.hero{
  position:relative; overflow:hidden; isolation:isolate; color:#fff;
  min-height:230px; padding:28px 24px 22px; border-radius:32px;
  background:
    radial-gradient(90% 120% at 0% 0%,#7c6cff 0%,transparent 55%),
    radial-gradient(80% 100% at 100% 0%,#ff7ad9 0%,transparent 50%),
    radial-gradient(100% 100% at 50% 130%,#2ee6c5 0%,transparent 55%),
    #141029;
  box-shadow:0 30px 60px -24px rgba(124,108,255,.65);
}
.hero::before{
  content:""; position:absolute; width:220px; height:220px; right:-60px; top:-70px; border-radius:50%; z-index:-1;
  border:1px solid rgba(255,255,255,.25); box-shadow:0 0 0 38px rgba(255,255,255,.04), 0 0 0 80px rgba(255,255,255,.025);
}
.hero::after{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:1px; pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,.28),transparent 40%,rgba(255,255,255,.06));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor;
  mask-composite:exclude;
}
.hero-scope{
  display:inline-block; padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.14); backdrop-filter:blur(8px);
  color:rgba(255,255,255,.85); font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
}
.hero-amount{font-family:var(--font-display); font-size:56px; font-weight:700; letter-spacing:-.05em; line-height:1.05; margin:18px 0 4px; text-shadow:0 4px 24px rgba(0,0,0,.25)}
.hero .muted, .hero .faint{color:rgba(255,255,255,.72)}
.hero-sub{display:flex; gap:8px; margin-top:22px}
.hero-sub .item{flex:1; display:flex; flex-direction:column; gap:2px; padding:11px 13px; border-radius:16px; background:rgba(5,6,10,.28); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.14)}
.hero-sub .item{min-width:0}
.hero-sub .item .v{font-family:var(--font-mono); font-weight:700; font-size:15px; white-space:nowrap}

.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.stat-tile{
  background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 92%,#fff 8%),var(--surface));
  border:1px solid var(--border); border-radius:24px; padding:16px; box-shadow:var(--shadow);
  transition:transform .2s ease, border-color .2s;
}
.stat-tile:hover{transform:translateY(-2px); border-color:color-mix(in srgb,var(--accent-joint) 40%,transparent)}
.stat-tile .label{font-size:10.5px; color:var(--fg-muted); font-weight:700; text-transform:uppercase; letter-spacing:.1em}
.stat-tile .value{font-family:var(--font-display); font-size:24px; font-weight:700; margin-top:6px; letter-spacing:-.03em}
.stat-tile .value.num{font-family:var(--font-mono); font-size:20px}

.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.cal-cell{aspect-ratio:1; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700}
.cal-dow{font-size:9px; color:var(--fg-faint); text-align:center; font-weight:700; text-transform:uppercase}

/* ---------- registro rápido (iconos por categoría) ---------- */
.quickrow{display:flex; gap:10px; overflow-x:auto; padding:2px 2px 6px; -webkit-overflow-scrolling:touch; scrollbar-width:none}
.quickrow::-webkit-scrollbar{display:none}
.qchip{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:56px; cursor:pointer; background:none; border:none; padding:0; color:inherit}
.qchip .ic{width:48px; height:48px; border-radius:17px; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:var(--shadow); transition:transform .15s}
.qchip .ic svg{width:18px; height:18px}
.qchip:active .ic{transform:scale(.92)}
.qchip span{font-size:10.5px; font-weight:700; color:var(--fg-muted); white-space:nowrap}

/* ---------- selectores de categoría / icono / color ---------- */
.cat-grid{display:flex; flex-wrap:wrap; gap:8px}
.cat-chip{display:flex; align-items:center; gap:7px; border:1px solid var(--border); background:var(--surface-2); color:var(--fg-muted);
  border-radius:999px; padding:7px 14px 7px 7px; font-size:12.5px; font-weight:700; cursor:pointer}
.cat-chip .ic{width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0}
.cat-chip .ic svg{width:12px; height:12px}
.cat-chip.active{border-color:var(--accent-joint); color:var(--fg); background:color-mix(in srgb, var(--accent-joint) 16%, var(--surface-2)); box-shadow:0 0 0 2px var(--accent-joint) inset}
.icon-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px}
.icon-choice{aspect-ratio:1; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--fg-muted); display:flex; align-items:center; justify-content:center; cursor:pointer}
.icon-choice svg{width:16px; height:16px}
.icon-choice.active{border-color:var(--accent-joint); color:var(--accent-joint); background:color-mix(in srgb, var(--accent-joint) 15%, var(--surface-2)); box-shadow:0 0 0 2px var(--accent-joint) inset}
.color-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:8px}
.color-choice{aspect-ratio:1; border-radius:10px; border:2px solid transparent; cursor:pointer}
.color-choice.active{border-color:var(--fg)}

/* ---------- listas ---------- */
.tx-row{display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid var(--border)}
.tx-row:last-child{border-bottom:none}
.tx-icon{width:44px; height:44px; border-radius:15px; display:flex; align-items:center; justify-content:center; flex-shrink:0}
.tx-icon svg{width:19px; height:19px}
.tx-body{flex:1; min-width:0}
.tx-title{font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tx-meta{font-size:12px; color:var(--fg-muted); margin-top:1px}
.tx-amount{font-family:var(--font-mono); font-weight:700; font-size:15px; white-space:nowrap}
.empty{
  text-align:center; padding:34px 16px; color:var(--fg-muted); font-size:13.5px;
  border:1px solid var(--border); border-radius:20px; background:color-mix(in srgb,var(--surface) 60%,transparent);
}
.empty svg{width:26px; height:26px; margin:0 auto 10px; color:var(--fg-faint)}

/* ---------- presupuestos / metas ---------- */
.budget-row{display:flex; flex-direction:column; gap:8px; padding:14px 0; border-bottom:1px solid var(--border)}
.budget-row:last-child{border-bottom:none}
.bar-track{height:10px; border-radius:999px; background:var(--surface-2); overflow:hidden}

/* ---- "12 café ayer" -> {amount, note, date} ---- */
function parseNaturalInput(text){
  text = (text||'').trim();
  if(!text) return null;
  let date = todayISO();
  const low = text.toLowerCase();
  if(/\bayer\b/.test(low)){ const d=new Date(); d.setDate(d.getDate()-1); date=d.toISOString().slice(0,10); text=text.replace(/\bayer\b/i,'').trim(); }
  else if(/\banteayer\b/.test(low)){ const d=new Date(); d.setDate(d.getDate()-2); date=d.toISOString().slice(0,10); text=text.replace(/\banteayer\b/i,'').trim(); }
  else if(/\bhoy\b/.test(low)){ text=text.replace(/\bhoy\b/i,'').trim(); }
  const m = text.match(/(\d+(?:[.,]\d{1,2})?)/);
  if(!m) return null;
  const amount = parseFloat(m[1].replace(',','.'));
  if(!amount || amount<=0) return null;
  const note = (text.slice(0,m.index) + text.slice(m.index+m[0].length)).replace(/[€\-–]/g,' ').replace(/\s+/g,' ').trim();
  return {amount, note: note || 'Movimiento rápido', date};
}

/* ---- entrada natural: importes con miles, varios movimientos y "pagó X" ---- */
const AMT_RE = /(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)/;
const PAYER_RE = /\bpag(?:ó|o|a|ué|ue|ado)\s+(?:por\s+)?(yo|ella|él|el|silvia|jesús|jesus|mi pareja|pareja)\b/i;
function toAmount(tok){
  if(/^\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?$/.test(tok)) return parseFloat(tok.replace(/\./g,'').replace(',','.'));
  return parseFloat(tok.replace(',','.'));
}
function resolvePayer(word, me, other){
  const w = normName(word);
  if(w==='yo') return me;
  if(['ella','el','pareja','mi pareja'].includes(w)) return other || null;
  const i = IDENTITIES.find(x=>normName(x.first)===w);
  return i ? (profileOfIdentity(i) || null) : null;
}
function parseNaturalMulti(text){
  text = (text||'').trim();
  const out = {items:[], date:todayISO(), payer:null};
  if(!text) return out;
  const low = text.toLowerCase();
  const shift = n=>{ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };
  if(/\banteayer\b/.test(low)){ out.date=shift(2); text=text.replace(/\banteayer\b/i,' '); }
  else if(/\bayer\b/.test(low)){ out.date=shift(1); text=text.replace(/\bayer\b/i,' '); }
  else if(/\bhoy\b/.test(low)){ text=text.replace(/\bhoy\b/i,' '); }
  const pm = text.match(PAYER_RE);
  if(pm){ out.payer = pm[1]; text = text.replace(pm[0],' '); }
  text = text.replace(/\s+/g,' ').trim();
  let parts = text.split(/\s+y\s+|\s*;\s*|\s*\+\s*|,\s+(?=[^\d\s])/i).map(t=>t.trim()).filter(Boolean);
  if(parts.length>1 && !parts.every(t=>AMT_RE.test(t))) parts = [text];
  parts.forEach(t=>{
    const m = t.match(AMT_RE); if(!m) return;
    const amount = toAmount(m[1]); if(!amount || amount<=0) return;
    let note = (t.slice(0,m.index)+' '+t.slice(m.index+m[0].length)).replace(/[€\-–]/g,' ').replace(/\s+/g,' ').trim();
    note = note.replace(/^(de|en|del)\s+/i,'').trim();
    out.items.push({amount, note: note || 'Movimiento rápido'});
  });
  return out;
}

/* ---- recurring fixed charges: next due date + forgotten-subscription detector ---- */
function nextDueDate(r){
  const chargedThisMonth = state.movimientos.some(m=>m.recurrenteId===r.id && monthKey(m.date)===monthKey(todayISO()));
  const now = new Date();
  let targetMonth = now.getMonth(), targetYear = now.getFullYear();
  const day = Math.min(r.dayOfMonth||1, 28);
  if(chargedThisMonth || now.getDate() > day){
    targetMonth += 1;
    if(targetMonth>11){ targetMonth=0; targetYear+=1; }
  }
  return new Date(targetYear, targetMonth, day);
}
function daysUntil(d){ return Math.ceil((d - new Date())/86400000); }
function isForgotten(r){
  const since = r.lastReviewedAt || r.createdAt || Date.now();
  return (Date.now()-since)/86400000 > 60;
}
function upcomingRecurrentes(scope, profileId, withinDays){
  return state.recurrentes.filter(r=>r.active!==false && r.scope===scope && (scope==='conjunto' || r.profileId===profileId))
    .map(r=>({r, due:nextDueDate(r)}))
    .map(x=>({...x, days:daysUntil(x.due)}))
    .filter(x=>x.days<=withinDays)
    .sort((a,b)=>a.days-b.days);
}
async function ensureRecurringCharged(){
  if(!state.cloud) return;
  const month = monthKey(todayISO());
  const today = new Date();
  for(const r of state.recurrentes){
    if(r.active===false) continue;
    const already = state.movimientos.some(m=>m.recurrenteId===r.id && monthKey(m.date)===month);
    if(already) continue;
    const day = Math.min(r.dayOfMonth||1, 28);
    if(today.getDate() < day) continue;
    const date = month+'-'+String(day).padStart(2,'0');
    const other = state.profiles.find(p=>p.id!==r.profileId);
    let split = null;
    if(r.scope==='conjunto' && state.profiles.length===2){
      split = {[r.profileId]: r.amount/2, [other?other.id:'x']: r.amount/2};
    }
    try{
      await addMovimiento({type:'gasto', scope:r.scope, amount:r.amount, category:r.category, note:r.name, date, fixed:true, profileId:r.profileId, split, goalId:null, goalName:null, recurrenteId:r.id});
    }catch(e){ console.error('auto-charge', r.name, e); }
  }
}

/* ---- importar movimientos bancarios desde CSV ---- */
function parseCSVText(text){
  const delim = (text.split('\n')[0].split(';').length > text.split('\n')[0].split(',').length) ? ';' : ',';
  return text.split(/\r?\n/).filter(l=>l.trim()).map(line=>{
    const cells=[]; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){ inQ=!inQ; continue; }
      if(ch===delim && !inQ){ cells.push(cur); cur=''; continue; }
      cur+=ch;
    }
    cells.push(cur);
    return cells.map(c=>c.trim());
  });
}
function parseBankDate(s){
  s=(s||'').trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m) return `${m[3]}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  return null;
}
function parseBankAmount(s){
  s=(s||'').trim().replace(/[€\s]/g,'');
  if(!s) return null;
  if(s.includes(',') && s.includes('.')) s = s.replace(/\./g,'').replace(',','.');
  else if(s.includes(',')) s = s.replace(',','.');
  const v = parseFloat(s);
  return isNaN(v) ? null : v;
}
async function importBankCSV(text){

  let dateCol = findCol(['fecha','date']);

  if(dateCol<0) dateCol=0;
  if(amountCol<0) amountCol=rows[0].length-1;
  if(conceptCol<0) conceptCol=1;
  let count=0;
  for(const row of dataRows){
    const date = parseBankDate(row[dateCol]);
    const amount = parseBankAmount(row[amountCol]);
    if(!date || amount===null || amount===0) continue;
    const note = row[conceptCol] || '';
    const type = amount<0 ? 'gasto' : 'ingreso';
    const category = type==='gasto' ? (guessCategory(note,'gasto') || 'Otros') : 'Otros';
    await addMovimiento({type, scope:'individual', amount:Math.abs(amount), category, note, date, fixed:false, profileId:me.id, split:null, goalId:null, goalName:null, imported:true});
    count++;
  }
  render();
  return count;
}

/* ---- foto de ticket: comprime a un dataURL pequeño ---- */
function compressPhoto(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ()=>{
      img.onload = ()=>{
        const maxW = 800;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.6));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function totals(list){
  let ingresos=0, gastos=0, ahorro=0;
  list.forEach(m=>{
    if(m.type==='ingreso') ingresos += m.amount;
    else if(m.type==='gasto') gastos += m.amount;
    else if(m.type==='ahorro') ahorro += m.amount;
  });
  return {ingresos, gastos, ahorro, balance: ingresos-gastos-ahorro};
}
function categoryBreakdown(list){
  const map = {};
  list.filter(m=>m.type==='gasto').forEach(m=>{
    map[m.category] = (map[m.category]||0) + m.amount;
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}
function monthlySeries(list, months){
  const now = new Date();
  const keys = [];
  for(let i=months-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    keys.push(d.toISOString().slice(0,7));
  }
  return keys.map(k=>{
    const inM = list.filter(m=>monthKey(m.date)===k);
    const t = totals(inM);
    return {key:k, label:MONTHS[parseInt(k.slice(5,7),10)-1], ingresos:t.ingresos, gastos:t.gastos};
  });
}

function weeklySummary(list){
  const now = new Date();
  const startThis = new Date(now); startThis.setDate(now.getDate()-6); startThis.setHours(0,0,0,0);
  const startPrev = new Date(startThis); startPrev.setDate(startThis.getDate()-7);
  const inRange = (d,a,b)=>{ const dt=new Date(d+'T00:00:00'); return dt>=a && dt<b; };
  const thisWeek = list.filter(m=>m.type==='gasto' && inRange(m.date, startThis, new Date(now.getTime()+86400000)));
  const prevWeek = list.filter(m=>m.type==='gasto' && inRange(m.date, startPrev, startThis));
  if(!thisWeek.length && !prevWeek.length) return null;
  const biggest = thisWeek.slice().sort((a,b)=>b.amount-a.amount)[0] || null;
  const sumByCat = arr=>{ const m={}; arr.forEach(x=>{ m[x.category]=(m[x.category]||0)+x.amount; }); return m; };
  const curCat = sumByCat(thisWeek), prevCat = sumByCat(prevWeek);
  let savedCat=null, savedAmt=0;
  Object.keys(prevCat).forEach(cat=>{
    const diff = prevCat[cat] - (curCat[cat]||0);
    if(diff>savedAmt){ savedAmt=diff; savedCat=cat; }
  });
  return {biggest, savedCat, savedAmt, totalThis: thisWeek.reduce((s,m)=>s+m.amount,0)};
}
function renderWeeklySummary(list){
  const s = weeklySummary(list);
  if(!s) return '';
  return `<section>
    <div class="section-head"><h2>Resumen semanal</h2></div>
    <div class="card col" style="gap:10px">
      <div class="spread"><span class="muted" style="font-size:12.5px">Gastado esta semana</span><span class="num" style="font-weight:700">${fmtMoney(s.totalThis)}</span></div>
      ${s.biggest ? `<div class="tx-row" style="padding:0;border:none">

        <div class="tx-body"><div class="tx-title">Mayor gasto: ${escapeHtml(s.biggest.note||s.biggest.category)}</div><div class="tx-meta">${escapeHtml(s.biggest.category)} · ${fmtDate(s.biggest.date)}</div></div>

    </div>
  </section>`;
}

async function hashPin(pin, salt){
  try{
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('duet:'+salt+':'+pin));
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){ return null; }
}
async function checkPin(p, pin){
  if(p.pinHash){ const i = identityOf(p); return (await hashPin(pin, i ? i.key : 'x')) === p.pinHash; }
  return p.pin === pin;   // perfiles antiguos con PIN en claro
}

/* ---- Face ID / huella (WebAuthn, solo en este dispositivo) ---- */
const FACE_KEY = 'dc_face_';
function b64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function unb64(str){ return Uint8Array.from(atob(str), c=>c.charCodeAt(0)); }
function faceSupported(){ return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create); }
async function faceAvailable(){
  if(!faceSupported()) return false;
  try{ return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }catch(e){ return false; }
}
function faceRegistered(pid){ try{ return localStorage.getItem(FACE_KEY+pid); }catch(e){ return null; } }
async function faceRegister(p){
  const cred = await navigator.credentials.create({publicKey:{
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    rp:{name:'Duet'},
    user:{id:new TextEncoder().encode(p.id), name:p.name, displayName:p.name},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged'},
    timeout:60000
  }});
  localStorage.setItem(FACE_KEY+p.id, b64(cred.rawId));
}
async function faceVerify(pid){
  const raw = faceRegistered(pid);
  if(!raw) throw new Error('no-face');
  await navigator.credentials.get({publicKey:{
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    allowCredentials:[{type:'public-key', id:unb64(raw), transports:['internal']}],
    userVerification:'required', timeout:60000
  }});
}
function faceDisable(pid){ try{ localStorage.removeItem(FACE_KEY+pid); }catch(e){} }

  function refresh(){
    const d = root.querySelector('#pf-dots'); if(!d) return;
    d.innerHTML = Array.from({length:Math.max(PIN_MIN, buf.length)}).map((_,i)=>`<div class="pin-dot ${i<buf.length?'filled':''}"></div>`).join('');
    const ok = root.querySelector('.key.ok'); if(ok) ok.disabled = buf.length<PIN_MIN;
    const m = root.querySelector('#pf-msg'); if(m) m.textContent = msgTxt;
  }
  function shake(){ const c=root.querySelector('#pf'); if(c){ c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); } }
  function fail(t){ msgTxt=t; buf=''; shake(); refresh(); }
  function lockLeft(){ return Math.ceil((login.lockUntil-Date.now())/1000); }
  function startLockTimer(){
    clearInterval(timer);
    timer = setInterval(()=>{
      if(!alive()){ clearInterval(timer); return; }
      const l = lockLeft();
      if(l>0){ msgTxt='Demasiados intentos. Espera '+l+' s.'; } else { msgTxt=''; clearInterval(timer); }
      refresh();
    }, 500);
  }
  function locked(){
    if(lockLeft()>0){ msgTxt='Demasiados intentos. Espera '+lockLeft()+' s.'; buf=''; shake(); refresh(); startLockTimer(); return true; }
    return false;
  }
  function attemptFail(){
    login.fails++; buf='';
    if(login.fails>=5){ login.fails=0; login.lockUntil=Date.now()+30000; msgTxt='Demasiados intentos. Espera 30 s.'; startLockTimer(); }
    else msgTxt = 'PIN incorrecto ('+(5-login.fails)+' intentos restantes).';
    shake(); refresh();
  }
  function press(k){
    if(busy) return;
    msgTxt='';
    if(k==='⌫') buf = buf.slice(0,-1);
    else if(k==='✓'){ submit(); return; }
    else if(buf.length<PIN_MAX) buf += k;
    refresh();
    if(buf.length===PIN_MAX) submit();
  }
  async function pinTaken(v, except){
    for(const pr of registeredProfiles()){ if(pr!==except && await checkPin(pr, v)) return true; }
    return false;
  }
  async function submit(){
    if(busy || buf.length<PIN_MIN) return;
    const v = buf; busy = true;
    try{
      if(o.type==='login'){
        if(locked()) return;
        let found=null; for(const pr of registeredProfiles()){ if(await checkPin(pr, v)){ found=pr; break; } }
        if(found){ login.fails=0; const dd=root.querySelector('#pf-dots'); if(dd) dd.classList.add('ok'); await new Promise(r=>setTimeout(r,280)); o.onSuccess(found); } else attemptFail();
      }
      else if(o.type==='create'){
        if(step===0){
          if(await pinTaken(v)){ fail('Ese PIN no está disponible. Elige otro.'); return; }
          first=v; step=1; buf=''; msgTxt=''; paint();
        }else{
          if(v!==first){ first=''; step=0; buf=''; paint(); msgTxt='Los dos PIN no coinciden. Empieza de nuevo.'; refresh(); shake(); return; }
          const id = await addProfile(o.ident.full, v);
          state.justCreated = id;
          o.onSuccess({id, name:o.ident.full});
        }
      }
      else if(o.type==='reset'){
        if(step===0){
          if(locked()) return;
          if(await checkPin(o.other, v)){ login.fails=0; step=1; buf=''; msgTxt=''; paint(); }
          else attemptFail();
        }else if(step===1){
          if(await pinTaken(v, o.target)){ fail('Ese PIN no está disponible. Elige otro.'); return; }
          first=v; step=2; buf=''; msgTxt=''; paint();
        }else{
          if(v!==first){ first=''; step=1; buf=''; paint(); msgTxt='Los dos PIN no coinciden. Inténtalo otra vez.'; refresh(); shake(); return; }
          await setProfilePin(o.target, v);
          o.onSuccess(o.target);
        }
      }
      else{ /* change */
        if(step===0){
          if(locked()) return;
          let found=null;
          if(o.profile){ if(await checkPin(o.profile, v)) found=o.profile; }
          else{ for(const pr of registeredProfiles()){ if(await checkPin(pr, v)){ found=pr; break; } } }
          if(!found){ attemptFail(); return; }
          login.fails=0; who=found; step=1; buf=''; msgTxt=''; paint();
        }else if(step===1){
          if(await pinTaken(v)){ fail('Ese PIN no está disponible. Elige otro.'); return; }
          first=v; step=2; buf=''; msgTxt=''; paint();
        }else{
          if(v!==first){ first=''; step=1; buf=''; paint(); msgTxt='Los dos PIN no coinciden. Inténtalo otra vez.'; refresh(); shake(); return; }
          await setProfilePin(who, v);
          o.onSuccess(who);
        }
      }
    }catch(e){ console.error(e); fail('No se pudo completar. Inténtalo de nuevo.'); }
    finally{ busy=false; }
  }
  /* teclado físico (ordenador) */
  const onKey = e=>{
    if(!alive()){ document.removeEventListener('keydown', onKey); return; }
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    if(/^\d$/.test(e.key)) press(e.key);
    else if(e.key==='Backspace') press('⌫');
    else if(e.key==='Enter') press('✓');
  };
  document.addEventListener('keydown', onKey);
  paint();
  if(lockLeft()>0){ locked(); }
}

function loginMode(){
  const ident = IDENTITIES.find(i=>i.key===login.key);
  if(ident && !profileOfIdentity(ident)) return 'create';
  if(login.reset && registeredProfiles().length===2) return login.reset==='pick' ? 'resetpick' : 'reset';
  if(login.change && registeredProfiles().length) return 'change';
  return 'login';
}

function wireLogin(){
  const $ = id=>document.getElementById(id);
  document.querySelectorAll('[data-who]').forEach(b=>b.addEventListener('click', ()=>{ login.key=b.getAttribute('data-who'); login.change=false; render(); }));
  const back = $('lg-back'); if(back) back.addEventListener('click', ()=>{ login.key=null; login.change=false; login.reset=null; render(); });
  const fg = $('lg-forgot'); if(fg) fg.addEventListener('click', ()=>{ login.reset='pick'; render(); });
  document.querySelectorAll('[data-forgot]').forEach(b=>b.addEventListener('click', ()=>{ login.reset=b.getAttribute('data-forgot'); render(); }));
  const chg = $('lg-change'); if(chg) chg.addEventListener('click', ()=>{ login.change=true; render(); });
  document.querySelectorAll('[data-face]').forEach(b=>b.addEventListener('click', async ()=>{
    const pr = profileById(b.getAttribute('data-face'));
    try{ await faceVerify(pr.id); finishLogin(pr); }
    catch(e){ toast('No se pudo verificar. Usa tu PIN.'); }
  }));
  const root = $('lg-root'); if(!root) return;
  const mode = loginMode();
  const ident = IDENTITIES.find(i=>i.key===login.key);
  const rtI = IDENTITIES.find(i=>i.key===login.reset);
  const target = mode==='reset' && rtI ? profileOfIdentity(rtI) : null;
  const otherP = target ? registeredProfiles().find(pr=>pr!==target) : null;
  mountPinFlow(root, {type:mode, ident, target, other:otherP, onSuccess: pr=>{ login.key=null; login.change=false; login.reset=null; finishLogin(pr); }});
  /* Face ID automático al abrir (si el navegador lo permite sin tocar nada) */
  if(mode==='login' && !login.autoTried && faceSupported()){
    login.autoTried = true;
    const lp = registeredProfiles().find(pr=>{ const i=identityOf(pr); return i && i.key===login.last && faceRegistered(pr.id); });
    if(lp) faceVerify(lp.id).then(()=>finishLogin(lp)).catch(()=>{});
  }
}

/* ============================= MES CONTRA MES + PREVISIÓN ============================= */
function monthDailyCum(list, year, monthIdx){
  const n = new Date(year, monthIdx+1, 0).getDate(); const daily = Array(n).fill(0);
  list.forEach(m=>{
    if(m.type!=='gasto') return;
    const dt = new Date(m.date+'T00:00:00');
    if(dt.getFullYear()===year && dt.getMonth()===monthIdx) daily[dt.getDate()-1] += m.amount;
  });
  let a = 0; const cum = daily.map(v=>(a+=v));
  return {n, daily, cum};
}
function compactEur(v){ return v>=1000 ? (v/1000).toFixed(v>=10000?0:1).replace('.',',')+' k€' : Math.round(v)+' €'; }
function monthNameOf(k){ const [y,m]=k.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('es-ES',{month:'long'}); }
function deltaHtml(cur, prev){
  if(prev<=0) return cur>0 ? '<span class="dl eq">nuevo</span>' : '';
  const pct = (cur-prev)/prev*100;
  if(Math.abs(pct)<0.5) return '<span class="dl eq">=</span>';
  return `<span class="dl ${pct>0?'up':'down'}">${pct>0?'▲ +':'▼ −'}${Math.abs(pct).toFixed(0)} %</span>`;
}
function renderMonthCompare(cfg, catKey, catPrevKey, catOff){
  const [y,mo] = catKey.split('-').map(Number);
  const cur = monthDailyCum(cfg.list, y, mo-1);
  const pd = new Date(y, mo-2, 1);
  const prev = monthDailyCum(cfg.list, pd.getFullYear(), pd.getMonth());
  const isNow = catOff===0;
  const today = isNow ? new Date().getDate() : cur.n;
  const spent = cur.cum[today-1] || 0;
  const prevTotal = prev.cum[prev.n-1] || 0;
  const labCur = monthNameOf(catKey), labPrev = monthNameOf(catPrevKey);
  if(!spent && !prevTotal) return '';

  /* previsión (solo mes en curso): ritmo de gasto variable + fijos que aún no se han cobrado */
  const meId = state.currentProfileId;
  const varSpent = cfg.list.filter(m=>m.type==='gasto' && !m.fixed && monthKey(m.date)===catKey).reduce((a,m)=>a+m.amount,0);
  const varAvg = varSpent/Math.max(1,today);
  const pending = isNow ? state.recurrentes.filter(r=>r.active!==false && r.scope===cfg.scope && (cfg.scope==='conjunto' || r.profileId===meId)
      && Math.min(r.dayOfMonth||1,28)>today && !state.movimientos.some(m=>m.recurrenteId===r.id && monthKey(m.date)===catKey))
    .map(r=>({day:Math.min(r.dayOfMonth||1,28), amount:r.amount})) : [];
  const projAt = d => spent + varAvg*(d-today) + pending.filter(x=>x.day<=d).reduce((a,x)=>a+x.amount,0);
  const forecast = isNow ? projAt(cur.n) : spent;
  const income = cfg.list.filter(m=>m.type==='ingreso' && monthKey(m.date)===catKey).reduce((a,m)=>a+m.amount,0);
  const vsPrev = prevTotal>0 ? (forecast-prevTotal)/prevTotal*100 : null;

  /* gráfico de líneas: gasto acumulado */
  const W=320, H=178, pl=42, pr=10, pt=12, pb=24, iw=W-pl-pr, ih=H-pt-pb;
  const N = Math.max(cur.n, prev.n);
  const maxV = Math.max(1, ...cur.cum.slice(0,today), forecast, ...prev.cum);
  const mag = Math.pow(10, Math.floor(Math.log10(maxV)));
  const yMax = Math.ceil(maxV/mag*2)/2*mag;
  const X = d=>pl+(d-1)/(N-1)*iw, Y = v=>pt+ih-(v/yMax)*ih;
  const pts = arr=>arr.map((v,i)=>X(i+1).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const projPts = isNow ? Array.from({length:cur.n-today+1},(_,i)=>X(today+i).toFixed(1)+','+Y(projAt(today+i)).toFixed(1)).join(' ') : '';
  const xTicks = [...new Set([1,8,15,22,N])].filter(d=>d<=N);
  const grid = [0,.5,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(yMax*f)}" y2="${Y(yMax*f)}" stroke="var(--border)" stroke-width="1"/><text x="${pl-6}" y="${Y(yMax*f)+3.5}" font-size="9.5" fill="var(--fg-muted)" text-anchor="end" font-family="var(--font-mono)">${compactEur(yMax*f)}</text>`).join('');
  const xl = xTicks.map(d=>`<text x="${X(d)}" y="${H-7}" font-size="9.5" fill="var(--fg-muted)" text-anchor="middle" font-family="var(--font-body)">${d}</text>`).join('');
  window.__fc = {W, pl, iw, N, cur, prev, today, isNow, projAt, labCur, labPrev};
  const chart = `<div class="fc-wrap"><div class="fc-tip" id="fc-tip"></div>
    <svg id="fc-svg" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;touch-action:pan-y;display:block" role="img" aria-label="Gasto acumulado de ${labCur} comparado con ${labPrev}${isNow?', con previsión a fin de mes':''}">
      ${grid}${xl}
      <polyline points="${pts(prev.cum)}" fill="none" stroke="var(--fg-faint)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${isNow ? `<polyline points="${projPts}" fill="none" stroke="var(--accent-joint)" stroke-width="2" stroke-dasharray="5 4" opacity=".75" stroke-linecap="round"/>
        <circle cx="${X(cur.n)}" cy="${Y(forecast)}" r="4.5" fill="var(--surface)" stroke="var(--accent-joint)" stroke-width="2"/>` : ''}
      <polyline points="${pts(cur.cum.slice(0,today))}" fill="none" stroke="var(--accent-joint)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(today)}" cy="${Y(spent)}" r="4.5" fill="var(--accent-joint)" stroke="var(--surface)" stroke-width="2"/>
      <line id="fc-x" x1="0" x2="0" y1="${pt}" y2="${pt+ih}" stroke="var(--fg-faint)" stroke-width="1" style="display:none"/>
      <rect id="fc-hit" x="${pl}" y="0" width="${iw}" height="${H}" fill="transparent"/>
    </svg></div>
    <div class="legend"><span><i class="sw cur"></i>${labCur}</span>${isNow?'<span><i class="sw proj"></i>Previsión</span>':''}<span><i class="sw prv"></i>${labPrev}</span></div>`;

  const tile = (l,v,sub,color)=>`<div class="stat-tile"><div class="label">${l}</div><div class="value num" style="${color?'color:'+color:''}">${v}</div>${sub?`<div class="kpi-delta muted" style="margin-top:4px">${sub}</div>`:''}</div>`;
  const tiles = isNow ? [
    tile('Previsión fin de mes', fmtMoney(forecast), vsPrev===null ? 'Sin mes anterior' : `<span class="dl ${vsPrev>0?'up':'down'}" style="margin:0">${vsPrev>0?'▲ +':'▼ −'}${Math.abs(vsPrev).toFixed(0)} %</span> vs ${labPrev}`),
    tile('Gastado hasta hoy', fmtMoney(spent), `Día ${today} de ${cur.n}`),
    tile('Ritmo diario', fmtMoney(varAvg), 'gastos variables'),
    income>0 ? tile('Saldo previsto', fmtMoney(income-forecast), 'ingresos − previsión', income-forecast>=0?'var(--good)':'var(--bad)') : tile(labPrev, fmtMoney(prevTotal), 'total del mes anterior')
  ] : [
    tile('Total de '+labCur, fmtMoney(spent), ''),
    tile(labPrev, fmtMoney(prevTotal), prevTotal>0 ? deltaHtml(spent, prevTotal)+' el mes cerrado' : ''),
  ];

  /* comparativa por categoría */
  const sumBy = key=>{ const m={}; cfg.list.filter(x=>x.type==='gasto' && monthKey(x.date)===key).forEach(x=>{ const c=x.category||'Otros'; m[c]=(m[c]||0)+x.amount; }); return m; };
  const cm = sumBy(catKey), pm = sumBy(catPrevKey);
  let names = [...new Set([...Object.keys(cm), ...Object.keys(pm)])].sort((a,b)=>Math.max(cm[b]||0,pm[b]||0)-Math.max(cm[a]||0,pm[a]||0));
  const rowsData = names.slice(0,8).map(n=>({n, c:cm[n]||0, p:pm[n]||0, color:catMeta(n,'gasto').color}));
  if(names.length>8){ const rest=names.slice(8); rowsData.push({n:'Otras', c:rest.reduce((a,n)=>a+(cm[n]||0),0), p:rest.reduce((a,n)=>a+(pm[n]||0),0), color:'var(--fg-muted)'}); }
  const mx = Math.max(1, ...rowsData.map(r=>Math.max(r.c,r.p)));
  const rows = rowsData.map(r=>`<div class="cmp-row" title="${escapeHtml(r.n)}: ${fmtMoney(r.c)} en ${labCur} · ${fmtMoney(r.p)} en ${labPrev}">
      <div class="spread"><span class="row" style="gap:8px"><span class="cdot" style="background:${r.color}"></span><b style="font-size:13.5px">${escapeHtml(r.n)}</b></span>
        <span class="num" style="font-size:12.5px">${fmtMoney(r.c)}${deltaHtml(r.c, r.p)}</span></div>
      <div class="cmp-bars"><i class="b-cur" style="width:${(r.c/mx*100).toFixed(1)}%"></i><i class="b-prv" style="width:${(r.p/mx*100).toFixed(1)}%"></i></div>
      <div class="faint num" style="font-size:11px;margin-top:3px">${labPrev}: ${fmtMoney(r.p)}</div>
    </div>`).join('');

  return `<section>
    <div class="section-head"><h2>${isNow?'Previsión de fin de mes':'Cierre de '+escapeHtml(labCur)}</h2></div>
    <div class="stat-grid" style="margin-bottom:12px">${tiles.join('')}</div>
    <div class="card col" style="gap:10px"><div class="muted" style="font-size:12px">Gasto acumulado día a día${isNow?' · la línea discontinua es la previsión':''}</div>${chart}</div>
  </section>
  <section>
    <div class="section-head"><h2>Mes contra mes</h2><span class="muted" style="font-size:12px">${labCur} vs ${labPrev}</span></div>
    <div class="card col" style="gap:4px">

      ${rows || '<div class="empty">Sin gastos en estos dos meses.</div>'}
    </div>
  </section>`;
}
function wireForecast(){
  const c = window.__fc, svg = document.getElementById('fc-svg'); if(!c || !svg) return;
  const tip = document.getElementById('fc-tip'), line = document.getElementById('fc-x');
  const move = e=>{
    const r = svg.getBoundingClientRect();
    const px = (e.clientX-r.left)/r.width*c.W;
    let d = Math.round((px-c.pl)/c.iw*(c.N-1))+1; d = Math.max(1, Math.min(c.N, d));
    const x = c.pl+(d-1)/(c.N-1)*c.iw;
    line.setAttribute('x1',x); line.setAttribute('x2',x); line.style.display='';
    let h = `<b>Día ${d}</b>`;
    if(d<=c.today) h += `<div><i class="sw cur"></i>${c.labCur}: ${fmtMoney(c.cur.cum[d-1])}</div>`;
    else if(c.isNow && d<=c.cur.n) h += `<div><i class="sw proj"></i>Previsión: ${fmtMoney(c.projAt(d))}</div>`;
    if(d<=c.prev.n) h += `<div><i class="sw prv"></i>${c.labPrev}: ${fmtMoney(c.prev.cum[d-1])}</div>`;
    tip.innerHTML = h; tip.style.display='block';
    const wrap = svg.parentElement.getBoundingClientRect().width;
    tip.style.left = Math.max(70, Math.min(wrap-70, x/c.W*r.width))+'px';
  };
  const hide = ()=>{ tip.style.display='none'; line.style.display='none'; };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', hide); svg.addEventListener('pointercancel', hide);
}

/* ============================= BUSCADOR Y FILTROS ============================= */
function movFilters(scope){
  state.flt = state.flt || {};
  return state.flt[scope] || (state.flt[scope] = {q:'', month:'', cat:'', who:'', all:false});
}
function filterMovs(list, f){
  const q = normName(f.q||'');
  return list.filter(m=>{
    if(f.month && monthKey(m.date)!==f.month) return false;
    if(f.cat && m.category!==f.cat) return false;
    if(f.who && !(m.profileId===f.who || m.paidBy===f.who)) return false;
    if(q){
      const hay = normName([m.note, m.category, m.goalName, String(m.amount), String(m.amount).replace('.',',')].join(' '));
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function paintMovList(){
  const ctx = window.__mv; const box = document.getElementById('mv-list'); if(!ctx || !box) return;
  const f = movFilters(ctx.scope);
  const active = !!(f.q || f.month || f.cat || f.who);
  const all = filterMovs(ctx.list, f);
  const shown = (active || f.all) ? all.slice(0,150) : all.slice(0,8);
  const gas = all.filter(m=>m.type==='gasto').reduce((a,m)=>a+m.amount,0);
  const ing = all.filter(m=>m.type==='ingreso').reduce((a,m)=>a+m.amount,0);
  const cnt = document.getElementById('mv-count'); if(cnt) cnt.textContent = all.length+(all.length===1?' movimiento':' movimientos');
  const sum = document.getElementById('mv-sum'); if(sum) sum.textContent = active ? 'Gastos '+fmtMoney(gas)+' · Ingresos '+fmtMoney(ing) : 'Más recientes primero';
  const clr = document.getElementById('mv-clear'); if(clr) clr.style.visibility = active ? 'visible' : 'hidden';
  let html = shown.length ? shown.map(m=>txRow(m)).join('')
    : `<div class="empty">${active ? 'No hay movimientos con esos filtros.' : 'Aún no hay movimientos aquí.<br>Toca una categoría de arriba para añadir el primero.'}</div>`;

function wireMovFilters(){
  const ctx = window.__mv; const q = document.getElementById('mv-q'); if(!ctx || !q) return;

  q.addEventListener('input', ()=>{ f.q=q.value; paintMovList(); });

      document.querySelectorAll('#ed-cats [data-cname]').forEach(x=>x.classList.toggle('active', x===b));

      const note = document.getElementById('ed-note').value.trim();
      if(!amount || amount<=0){ toast('Pon un importe válido'); return; }

      const old = {amount:m.amount, date:m.date, note:m.note||''};

/* ============================= AVISOS ============================= */
function computeAlerts(){
  const me = profileById(state.currentProfileId); if(!me) return [];
  const month = monthKey(todayISO()); const out = [];
  state.presupuestos.forEach(b=>{
    if(!b.category || !(b.limit>0) || b.month!==month) return;
    if(b.scope==='individual' && b.profileId!==me.id) return;
    const spent = state.movimientos.filter(m=>m.type==='gasto' && m.category===b.category && monthKey(m.date)===month && m.scope===b.scope && (b.scope==='conjunto' || m.profileId===b.profileId)).reduce((a,m)=>a+m.amount,0);
    const pct = spent/b.limit;
    if(pct>=0.8){
      const over = pct>=1;
      out.push({key:'bud:'+b.id+':'+(over?'100':'80'), kind:over?'over':'warn', icon:'chart',
        title:b.category+(b.scope==='conjunto'?' (conjunta)':''),
        text: over ? 'Te has pasado '+fmtMoney(spent-b.limit)+' del presupuesto' : 'Vas por el '+Math.round(pct*100)+' % · quedan '+fmtMoney(b.limit-spent)});
    }
  });
  [['individual', me.id], ['conjunto', null]].forEach(([sc,pid])=>{
    upcomingRecurrentes(sc, pid, 3).forEach(x=>{
      out.push({key:'rec:'+x.r.id+':'+x.due.toISOString().slice(0,10), kind:'due', icon:'repeat', title:x.r.name,
        text: fmtMoney(x.r.amount)+' · '+(x.days<=0?'se cobra hoy':x.days===1?'se cobra mañana':'se cobra en '+x.days+' días')});
    });
  });
  const rank = {over:0, warn:1, due:2};
  return out.sort((a,b)=>rank[a.kind]-rank[b.kind]);
}
function renderAlertsBanner(){
  const list = computeAlerts(); if(!list.length) return '';
  return `<div class="card col" data-open-alerts style="gap:8px;margin-top:12px;cursor:pointer;border-color:color-mix(in srgb, var(--warn) 50%, transparent)">
    <div class="row" style="gap:8px"><span class="mini-ic" style="width:18px;height:18px;color:var(--warn)">${icon('bell')}</span><b style="font-size:14px">Avisos</b>

function showAlertToast(a, n){
  const host = document.getElementById('toastHost');
  host.querySelectorAll('.toast-alert').forEach(x=>x.remove());
  const el = document.createElement('div');
  el.className = 'toast-alert'; el.setAttribute('role','alert');
  el.innerHTML = `<b>${a.kind==='over'?'⛔':a.kind==='due'?'🔔':'⚠️'} ${escapeHtml(a.title)}</b><span>${escapeHtml(a.text)}</span>${n>1?`<small>+${n-1} aviso${n>2?'s':''} más · toca para verlos</small>`:''}`;
  el.addEventListener('click', ()=>{ el.remove(); openAlertsSheet(); });
  host.appendChild(el);
  setTimeout(()=>el.remove(), 6500);

function checkNewAlerts(){
  const now = computeAlerts();
  if(!state.alertSeen){ state.alertSeen = new Set(); state.alertBase = Date.now(); }
  if(Date.now()-state.alertBase < 4000){ now.forEach(a=>state.alertSeen.add(a.key)); return; }
  const fresh = now.filter(a=>!state.alertSeen.has(a.key));
  fresh.forEach(a=>state.alertSeen.add(a.key));
  if(fresh.length) showAlertToast(fresh[0], fresh.length);
}

function txRow(m){
  const isGasto = m.type==='gasto';

  const meta = isGasto ? catMeta(m.category,'gasto') : (isIngreso ? catMeta(m.category,'ingreso') : {icon:'piggy', color:'var(--accent-joint)'});
  const color = isGasto ? 'var(--bad)' : (isIngreso ? 'var(--good)' : 'var(--accent-joint)');
  const bg = isGasto ? 'color-mix(in srgb, var(--bad) 16%, transparent)' : isIngreso ? 'color-mix(in srgb, var(--good) 16%, transparent)' : 'color-mix(in srgb, var(--accent-joint) 18%, transparent)';
  const payerP = m.paidBy ? profileById(m.paidBy) : null;
  const owner = (m.scope==='conjunto' ? ' · conjunta' : '') + (payerP ? ' · pagó '+displayName(payerP) : '');
  const sign = isGasto||m.type==='ahorro' ? '-' : '+';
  const label = m.type==='gasto' ? m.category : (m.type==='ingreso'? m.category : (m.goalName ? (m.inversionId ? m.goalName : (m.tagId ? 'Etiqueta: '+m.goalName : 'Meta: '+m.goalName)) : 'Ahorro'));
  const fixedTag = (isGasto && m.fixed) ? (m.recurrenteId ? ' · fijo automático' : ' · fijo') : '';
  const nCom = (m.comments||[]).length;
  const reacts = Object.values(m.reactions||{});
  const social = (nCom ? ' · 💬 '+nCom : '') + (reacts.length ? ' · '+Array.from(new Set(reacts)).join('') : '');
  const sur = (m.surpriseUntil && m.surpriseUntil > todayISO()) ? ' · 🎁 sorpresa hasta '+fmtDate(m.surpriseUntil) : '';
  const tgx = (m.tagId && m.type!=='ahorro') ? tagById(m.tagId) : null;
  const tagTxt = tgx ? ' · 🏷 '+escapeHtml(tgx.name) : '';
  return `<div class="tx-row">
    ${m.receiptPhoto ? `<img src="${m.receiptPhoto}" data-view-photo="${m.id}" style="width:38px;height:38px;object-fit:cover;border-radius:11px;flex-shrink:0;cursor:pointer">` : `<div class="tx-icon" style="background:${bg};color:${color}">${icon(meta.icon)}</div>`}
    <div class="tx-body" data-open-mov="${m.id}" style="cursor:pointer">
      <div class="tx-title">${escapeHtml(m.note || label)}</div>

    <button class="btn-ghost" data-del-tx="${m.id}" style="padding:6px;border-radius:8px" aria-label="Eliminar">${icon('trash')}</button>
  </div>`;
}

/* ---- charts (hand-drawn inline SVG) ---- */
function barChart(series){
  const w=300,h=120, pad=22, bw= (w-pad*2)/series.length;
  const maxV = Math.max(1, ...series.map(s=>Math.max(s.ingresos,s.gastos)));
  const scale = v => (h-28) * (v/maxV);
  let bars='';
  series.forEach((s,i)=>{
    const x = pad + i*bw;
    const gH = scale(s.gastos), iH = scale(s.ingresos);
    const bw2 = (bw-10)/2;
    bars += `<rect x="${x}" y="${h-24-iH}" width="${bw2}" height="${iH}" rx="2" fill="var(--good)"/>`;
    bars += `<rect x="${x+bw2+2}" y="${h-24-gH}" width="${bw2}" height="${gH}" rx="2" fill="var(--bad)"/>`;
    bars += `<text x="${x+bw/2-3}" y="${h-8}" font-size="9" fill="var(--fg-muted)" text-anchor="middle" font-family="var(--font-body)">${s.label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;overflow:visible">
    <line x1="${pad}" y1="${h-24}" x2="${w-pad+10}" y2="${h-24}" stroke="var(--border)" stroke-width="1"/>
    ${bars}
  </svg>
  <div class="row" style="justify-content:center;gap:16px;margin-top:6px;font-size:11.5px">
    <span class="row" style="gap:5px"><span style="width:8px;height:8px;border-radius:2px;background:var(--good)"></span>Ingresos</span>
    <span class="row" style="gap:5px"><span style="width:8px;height:8px;border-radius:2px;background:var(--bad)"></span>Gastos</span>
  </div>`;
}
function calendarGrid(list, offset, scope){
  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth()+offset);
  const year=base.getFullYear(), monthIdx=base.getMonth();
  const daysInMonth = new Date(year, monthIdx+1, 0).getDate();
  const firstDow = (new Date(year, monthIdx, 1).getDay()+6)%7;
  const dayTotals = {};
  list.filter(m=>m.type==='gasto').forEach(m=>{
    const d = new Date(m.date+'T00:00:00');
    if(d.getFullYear()===year && d.getMonth()===monthIdx){
      dayTotals[d.getDate()] = (dayTotals[d.getDate()]||0) + m.amount;
    }
  });
  const maxDay = Math.max(1, ...Object.values(dayTotals));
  let cells='';
  for(let i=0;i<firstDow;i++) cells += `<div></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const amt = dayTotals[day]||0;
    const pct = amt>0 ? Math.max(0.14, amt/maxDay) : 0;
    const bg = amt>0 ? `color-mix(in srgb, var(--bad) ${Math.round(pct*85)}%, var(--surface-2))` : 'var(--surface-2)';
    const fg = pct>0.55 ? '#fff' : 'var(--fg-muted)';
    cells += `<div class="cal-cell" style="background:${bg};color:${fg}" title="${fmtMoney(amt)}">${day}</div>`;
  }
  const monthLabel = base.toLocaleDateString('es-ES',{month:'long', year:'numeric'});
  const dows = ['L','M','X','J','V','S','D'];
  return `
    <div class="spread" style="margin-bottom:10px">
      <button type="button" class="btn-ghost" data-cal-nav="-1" data-cal-scope="${scope}" style="padding:4px 10px;font-size:16px">‹</button>
      <span style="font-weight:700;font-size:13px;text-transform:capitalize">${monthLabel}</span>
      <button type="button" class="btn-ghost" data-cal-nav="1" data-cal-scope="${scope}" style="padding:4px 10px;font-size:16px" ${offset>=0?'disabled':''}>›</button>
    </div>
    <div class="cal-grid" style="margin-bottom:5px">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>`;
}
function donutChart(cats){
  const total = cats.reduce((s,c)=>s+c[1],0) || 1;
  const r=38, cx=48, cy=48, sw=14;
  let offset=0; let paths='';
  const circ = 2*Math.PI*r;
  cats.slice(0,6).forEach((c)=>{
    const frac = c[1]/total;
    const len = frac*circ;
    const color = catMeta(c[0],'gasto').color;
    paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += len;
  });
  return `<svg viewBox="0 0 96 96" style="width:96px;height:96px;flex-shrink:0">${paths}
    <circle cx="${cx}" cy="${cy}" r="${r-sw/2-2}" fill="var(--surface)"/>
  </svg>`;
}

function renderPresupuestos(){

function fmtEta(months){
  if(months<1) return 'menos de 1 mes';
  if(months<=18) return Math.ceil(months)+(Math.ceil(months)===1?' mes':' meses');
  return (months/12).toFixed(1).replace('.',',')+' años';
}
function goalPace(g, linked, current){
  const remaining = Math.max(0, (g.target||0)-current);
  if(g.target>0 && remaining===0) return {done:true, color:'var(--good)', text:'¡Meta conseguida! 🎉'};
  const MS = 30.44*86400000, now = new Date();
  const parts = []; let color = 'var(--fg-muted)';
  let rate = 0, etaOk = null;
  if(linked.length){
    const first = linked.map(m=>new Date(m.date+'T00:00:00')).sort((a,b)=>a-b)[0];
    const months = Math.max(1, (now-first)/MS);
    rate = current/months;
    if(rate>0){
      const left = remaining/rate, eta = new Date(now.getTime()+left*MS);
      parts.push('Al ritmo actual ('+fmtMoney(rate)+'/mes) llegaréis en '+fmtEta(left)+' · '+eta.toLocaleDateString('es-ES',{month:'short',year:'numeric'}));
      if(g.deadline) etaOk = eta <= new Date(g.deadline+'T23:59:59');
    }
  }else parts.push('Aún sin aportaciones: apunta un ahorro y calcularé el ritmo.');
  if(g.deadline){
    if(g.deadline < todayISO()){ parts.push('La fecha límite ya pasó.'); color='var(--bad)'; }
    else{
      const monthsLeft = Math.max(0.1, (new Date(g.deadline+'T23:59:59')-now)/MS);
      parts.push('Para llegar a tiempo: '+fmtMoney(remaining/monthsLeft)+'/mes.');
      if(etaOk===true) color='var(--good)'; else if(etaOk===false) color='var(--warn)';
    }
  }
  return {done:false, color, text:parts.join(' ')};
}

function openChallengeSheet(kind){
  const me = profileById(state.currentProfileId);
  if(!me){ openAccountSheet(); return; }
  let scope='individual', base='';
  const title = kind==='52weeks' ? 'Reto de las 52 semanas' : 'Mes sin gastos hormiga';
  function paint(){ openSheetWith(html(), wire); }
  function html(){
    return `
      <div class="spread sheet-title"><span>${title}</span>
        <button class="btn-ghost" id="sheet-close" style="padding:6px;border-radius:8px">${icon('close')}</button>
      </div>

        <p class="muted" style="font-size:12.5px;margin:0">${kind==='52weeks' ? 'Cada semana ahorras un poco más (semana 1 = importe base, semana 52 = 52× el importe base). En 1 año tendrás el total.' : 'Ponte un objetivo de ahorro para 30 días sin gastos hormiga (ocio y caprichos pequeños).'}</p>
        <div class="field"><label>${kind==='52weeks' ? 'Importe base (semana 1)' : 'Objetivo de ahorro'}</label><input id="ch-amount" type="number" min="1" step="1" placeholder="0" value="${escapeHtml(base)}"></div>
        <div class="field"><label>Ámbito</label>

            <button data-v="conjunto" class="${scope==='conjunto'?'active':''}">Conjunta</button>
          </div>
        </div>
        <button class="btn btn-primary btn-block" id="ch-submit" style="padding:14px">Crear reto</button>
      </div>`;
  }
  function wire(){
    document.getElementById('sheet-close').addEventListener('click', closeSheet);
    const amtEl = document.getElementById('ch-amount');
    amtEl.addEventListener('input', ()=>{ base = amtEl.value; });
    document.querySelectorAll('#ch-scope-seg button').forEach(b=>{
      b.addEventListener('click', ()=>{ scope=b.getAttribute('data-v'); paint(); });
    });
    document.getElementById('ch-submit').addEventListener('click', async ()=>{
      const v = parseFloat(base || amtEl.value);
      if(!v || v<=0){ toast('Pon un importe válido'); return; }
      let target, name, deadline=null;
      if(kind==='52weeks'){
        target = v*1378;
        name = 'Reto 52 semanas';
        const d = new Date(); d.setDate(d.getDate()+364); deadline = d.toISOString().slice(0,10);
      }else{
        target = v;
        name = 'Mes sin gastos hormiga';
        const d = new Date(); d.setDate(d.getDate()+30); deadline = d.toISOString().slice(0,10);
      }
      await addMeta({scope, profileId: scope==='individual'? me.id: null, name, target, deadline});
      closeSheet(); toast('¡Reto creado!');
    });
  }
  paint();
}

const DEFAULT_SHARES = {Comida:.25, Vivienda:.30, Transporte:.10, Ocio:.10, Salud:.05, Compras:.10, Otros:.10};
function monthKeysBack(n){
  const now = new Date(); const out=[];
  for(let i=1;i<=n;i++){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  return out;
}
function avgIncome3(profileId){
  const vals = monthKeysBack(3).map(k=>state.movimientos.filter(m=>m.type==='ingreso' && m.scope==='individual' && m.profileId===profileId && monthKey(m.date)===k).reduce((s,m)=>s+m.amount,0)).filter(v=>v>0);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
}
function varCfg(profileId){
  const c = state.presupuestos.find(p=>p.id==='cfg__'+profileId);
  return {variable: !!(c && c.variable), saveRate: c && typeof c.saveRate==='number' ? c.saveRate : 20};
}
function varBudgetTotal(profileId){
  const cfg = varCfg(profileId);
  return avgIncome3(profileId) * (1 - cfg.saveRate/100);
}
async function applyVariableBudget(){
  const me = profileById(state.currentProfileId); if(!me) return;
  const total = varBudgetTotal(me.id); if(!(total>0)) return;
  const month = monthKey(todayISO());
  const keys = monthKeysBack(3);
  const hist = {}; let histTotal = 0;
  state.movimientos.filter(m=>m.type==='gasto' && m.scope==='individual' && m.profileId===me.id && keys.includes(monthKey(m.date)) && m.category!=='Citas').forEach(m=>{
    hist[m.category] = (hist[m.category]||0)+m.amount; histTotal += m.amount;
  });
  const cats = allCats('gasto').map(c=>c.name).filter(n=>n!=='Citas');
  for(const cat of cats){
    const share = histTotal>0 ? (hist[cat]||0)/histTotal : (DEFAULT_SHARES[cat]||0.05);
    const key = ['individual',cat,month].join('__').replace(/[^a-zA-Z0-9_]/g,'-');
    await writePresupuesto(key, {scope:'individual', profileId:me.id, category:cat, month, limit:Math.round(total*share), auto:true});
  }
  render();
}
async function ensureVariableBudget(){
  const me = profileById(state.currentProfileId); if(!me) return;
  if(!varCfg(me.id).variable) return;
  const month = monthKey(todayISO());
  const has = state.presupuestos.some(p=>p.month===month && p.scope==='individual' && p.profileId===me.id);
  if(!has) await applyVariableBudget();
}
async function setVariableIncome(on){
  const me = profileById(state.currentProfileId); if(!me){ openAccountSheet(); return; }
  const cfg = varCfg(me.id);
  await writePresupuesto('cfg__'+me.id, {kind:'cfg', profileId:me.id, variable:on, saveRate:cfg.saveRate});
  if(on) await applyVariableBudget(); else render();
}
async function setVariableRate(v){
  const me = profileById(state.currentProfileId); if(!me) return;
  const rate = Math.max(0, Math.min(90, isNaN(v)?20:v));
  await writePresupuesto('cfg__'+me.id, {kind:'cfg', profileId:me.id, variable:true, saveRate:rate});
  await applyVariableBudget();
}
function renderVariableIncome(me, month){
  if(!me) return '';
  const cfg = varCfg(me.id);
  const avg = avgIncome3(me.id);
  const total = varBudgetTotal(me.id);

  return `<section>

          <div class="stat-tile"><div class="label">Presupuesto del mes</div><div class="value num">${total>0?fmtMoney(total):'—'}</div></div>
        </div>
        ${avg>0 ? `<div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
          <div class="spread muted" style="font-size:12px"><span>Gastado ${fmtMoney(spent)}</span><span>${total>spent?'Quedan '+fmtMoney(total-spent):'Excedido '+fmtMoney(spent-total)}</span></div>`
        : `<div class="muted" style="font-size:12.5px">Registra ingresos de meses anteriores para calcular la media.</div>`}
        <div class="field"><label>Ahorro objetivo sobre la media (%)</label><input id="var-rate" type="number" min="0" max="90" step="5" value="${cfg.saveRate}"></div>
        <button class="btn btn-block" id="var-apply">Recalcular reparto por categorías</button>` : ''}
    </div></section>`;

        <button class="nl-btn primary" id="mv-send" aria-label="Enviar">${icon('plus')}</button></div>
    </div>`;
  openSheetWith(html, ()=>{
    document.getElementById('sheet-close').addEventListener('click', closeSheet);
    document.getElementById('mv-edit').addEventListener('click', ()=>{ closeSheet(); openEditMovSheet(id); });
    const need = ()=>{ if(!me){ closeSheet(); openAccountSheet(); return false; } return true; };
    document.querySelectorAll('[data-react]').forEach(b=>b.addEventListener('click', async ()=>{
      if(!need()) return;
      const e = b.getAttribute('data-react');
      const next = {...(m.reactions||{})};
      if(next[me.id]===e) delete next[me.id]; else next[me.id]=e;
      await updateMovimiento(id, {reactions:next}); render(); openMovSheet(id);
    }));
    const send = async (text)=>{
      text = (text||'').trim(); if(!text) return;
      if(!need()) return;
      const list = [...(m.comments||[]), {id:uid(), by:me.id, text, at:Date.now()}];
      await updateMovimiento(id, {comments:list}); render(); openMovSheet(id);
    };
    document.querySelectorAll('[data-quick]').forEach(b=>b.addEventListener('click', ()=>send(b.getAttribute('data-quick'))));
    const inp = document.getElementById('mv-text');
    document.getElementById('mv-send').addEventListener('click', ()=>send(inp.value));
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') send(inp.value); });
  });
}


/* ============================= RACHA + RECORDATORIO NOCTURNO ============================= */
function chkDoc(pid){ return state.presupuestos.find(p=>p.id==='chk__'+pid); }
function loggedDays(pid){
  const set = new Set();
  state.movimientosAll.forEach(m=>{ if(m.profileId===pid && m.date) set.add(m.date); });
  const c = chkDoc(pid); if(c && Array.isArray(c.days)) c.days.forEach(d=>set.add(d));
  return set;
}
function isoShift(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function localToday(){ return isoShift(0); }
function streakInfo(pid){
  const set = loggedDays(pid);
  const today = localToday();
  const doneToday = set.has(today);
  let n = 0, i = doneToday ? 0 : -1;
  while(set.has(isoShift(i))){ n++; i--; }
  return {n, doneToday};
}
async function markNoSpendToday(){
  const pid = state.currentProfileId; if(!pid) return;
  const c = chkDoc(pid);
  const days = ((c && c.days) || []).filter(d=>d>=isoShift(-120));
  const today = localToday();
  if(!days.includes(today)) days.push(today);
  await writePresupuesto('chk__'+pid, {kind:'chk', profileId:pid, days});
  render();
  toast('Día apuntado · racha al día');
}
function reminderDismissed(){ try{ return localStorage.getItem('dc_rem_'+localToday())==='1'; }catch(e){ return false; } }
function renderNightReminder(){
  const pid = state.currentProfileId; if(!pid) return '';
  const st = streakInfo(pid);
  const late = new Date().getHours() >= 20;
  const chip = `<div class="row" style="gap:8px;font-size:12.5px"><span style="font-size:16px">🔥</span><span><b class="num">${st.n}</b> ${st.n===1?'día':'días'} de racha${st.doneToday?' · hoy apuntado ✓':''}</span></div>`;
  if(st.doneToday || !late || reminderDismissed()){
    return `<div class="card" style="padding:10px 14px;margin-top:12px">${chip}</div>`;
  }
  return `<div class="card col" style="gap:10px;margin-top:12px;border-color:color-mix(in srgb, var(--warn) 50%, transparent)">
    <div class="row" style="gap:8px"><span class="mini-ic" style="width:18px;height:18px;color:var(--warn)">${icon('moon')}</span><b style="font-size:14px">¿Has apuntado los gastos de hoy?</b></div>
    ${chip}
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" id="rem-add" style="flex:1">Apuntar ahora</button>
      <button class="btn" id="rem-none" style="flex:1">Hoy no gasté</button>
      <button class="btn-ghost" id="rem-later" style="font-size:12px">Luego</button>
    </div>
  </div>`;
}

/* ============================= CIERRE DE MES EN PAREJA ============================= */
function closeMonthKey(){
  const d = new Date();
  return d.getDate()<=10 ? prevMonthKey() : monthKey(todayISO());
}
function monthLabelOf(k){
  const [y,m]=k.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'});
}
function cierreDoc(month){ return state.presupuestos.find(p=>p.id==='cierre__'+month); }
function renderCierreCard(){
  const month = closeMonthKey();
  const doc = cierreDoc(month);
  const mine = doc && doc.answers && doc.answers[state.currentProfileId];
  const others = doc && doc.answers ? Object.keys(doc.answers).filter(k=>k!==state.currentProfileId).length : 0;
  return `<section>
    <div class="section-head"><h2 class="row" style="gap:7px;font-size:15px"><span class="mini-ic" style="width:15px;height:15px;color:var(--accent)">${icon('users')}</span>Cierre de mes</h2></div>
    <div class="card col" style="gap:10px">
      <div class="muted" style="font-size:12.5px">5 minutos juntos: resumen de ${escapeHtml(monthLabelOf(month))} y 3 preguntas.</div>
      <div style="font-size:12px" class="faint">${mine?'Tus respuestas están guardadas':'Aún no has respondido'}${others?' · tu pareja ya respondió':''}</div>
      <button class="btn btn-primary" id="cierre-open">${mine?'Ver cierre':'Empezar cierre'}</button>
    </div>
  </section>`;
}
function openCierreSheet(){
  const month = closeMonthKey();
  const pid = state.currentProfileId;
  const prev = (()=>{ const [y,m]=month.split('-').map(Number); const d=new Date(y,m-2,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();
  const joint = state.movimientos.filter(m=>m.scope==='conjunto');
  const cur = totals(joint.filter(m=>monthKey(m.date)===month));
  const prv = totals(joint.filter(m=>monthKey(m.date)===prev));
  const cats = categoryBreakdown(joint.filter(m=>monthKey(m.date)===month)).slice(0,3);
  const citas = joint.filter(m=>m.type==='gasto' && m.category==='Citas' && monthKey(m.date)===month).reduce((a,m)=>a+m.amount,0);
  const doc = cierreDoc(month);
  const ans = JSON.parse(JSON.stringify((doc && doc.answers) || {}));
  if(pid && !ans[pid]) ans[pid] = {a:'',b:'',c:''};
  const Q = [
    ['a','¿Qué fue de más este mes?','Un gasto que no repetiríais…'],
    ['b','¿Qué podemos mejorar?','Un hábito o categoría…'],
    ['c','¿Qué vamos a ahorrar?','Una cantidad o meta para el próximo mes…']
  ];
  let step = 0, secs = 300, timer = null;
  const delta = prv.gastos>0 ? (cur.gastos-prv.gastos)/prv.gastos*100 : null;
  paint();
  function save(){
    if(!pid) return;
    const data = {kind:'cierre', month, answers:ans, summary:{gastos:cur.gastos, ingresos:cur.ingresos, ahorro:cur.ahorro}, updatedAt:Date.now()};
    return writePresupuesto('cierre__'+month, data).then(()=>{ if(!state.cloud) render(); });
  }
  function body(){
    if(step===0){
      return `<div class="col" style="gap:10px">
        <div class="muted" style="font-size:12.5px">Cuenta conjunta · ${escapeHtml(monthLabelOf(month))}</div>
        <div class="spread"><span>Gastos</span><b class="num" style="color:var(--bad)">${fmtMoney(cur.gastos)}</b></div>
        <div class="spread"><span>Ingresos</span><b class="num" style="color:var(--good)">${fmtMoney(cur.ingresos)}</b></div>
        <div class="spread"><span>Ahorro</span><b class="num">${fmtMoney(cur.ahorro)}</b></div>
        <div class="spread"><span>Citas y ocio en pareja</span><b class="num">${fmtMoney(citas)}</b></div>
        ${delta!==null?`<div class="faint" style="font-size:12px">${delta>=0?'+':''}${delta.toFixed(0)}% de gasto vs. el mes anterior</div>`:''}
        ${cats.length?`<div class="faint" style="font-size:12px;margin-top:4px">Lo que más pesó</div>`+cats.map(c=>`<div class="spread"><span>${escapeHtml(c[0])}</span><span class="num">${fmtMoney(c[1])}</span></div>`).join(''):''}
        <button class="btn btn-primary" id="ci-next">Empezar preguntas</button>
      </div>`;
    }
    if(step<=3){
      const [k,q,ph] = Q[step-1];
      const others = Object.keys(ans).filter(x=>x!==pid && ans[x][k]);
      return `<div class="col" style="gap:10px">
        <b style="font-size:15px">${step}/3 · ${q}</b>
        <textarea id="ci-text" rows="3" placeholder="${ph}" style="width:100%;padding:10px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font:inherit">${escapeHtml(ans[pid]?ans[pid][k]:'')}</textarea>
        ${others.map(x=>{ const pr=profileById(x); return `<div class="card" style="padding:10px 12px;font-size:13px"><span class="faint">${escapeHtml(pr?pr.name:'Pareja')}:</span> ${escapeHtml(ans[x][k])}</div>`; }).join('')}
        <div class="row" style="gap:8px"><button class="btn" id="ci-back" style="flex:1">Atrás</button><button class="btn btn-primary" id="ci-next" style="flex:1">${step===3?'Terminar':'Siguiente'}</button></div>
      </div>`;
    }
    return `<div class="col" style="gap:10px">
      <b style="font-size:15px">Cierre completado ✓</b>
      ${Q.map(([k,q])=>`<div><div class="faint" style="font-size:12px">${q}</div>${Object.keys(ans).filter(x=>ans[x][k]).map(x=>{const pr=profileById(x);return `<div style="font-size:13px"><b>${escapeHtml(pr?pr.name:'Pareja')}:</b> ${escapeHtml(ans[x][k])}</div>`;}).join('')||'<div class="faint" style="font-size:13px">—</div>'}</div>`).join('')}
      <button class="btn btn-primary" id="ci-close">Cerrar</button>
    </div>`;
  }
  function paint(){
    openSheetWith(`<div class="spread sheet-title"><span>Cierre de mes</span><span class="row" style="gap:8px"><span class="faint num" id="ci-timer" style="font-size:12px"></span><button class="btn-ghost" id="sheet-close" style="padding:6px;border-radius:8px">${icon('close')}</button></span></div>${body()}`, wire);
  }
  function tick(){
    const el = document.getElementById('ci-timer');
    if(!el){ clearInterval(timer); return; }
    secs = Math.max(0, secs-1);
    el.textContent = '⏱ '+Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  }
  function wire(){
    const close = ()=>{ clearInterval(timer); closeSheet(); };
    document.getElementById('sheet-close').addEventListener('click', close);
    const cl = document.getElementById('ci-close'); if(cl) cl.addEventListener('click', close);
    const t = document.getElementById('ci-timer');
    if(t){ t.textContent = '⏱ '+Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0'); clearInterval(timer); timer = setInterval(tick,1000); }
    const store = ()=>{ const ta=document.getElementById('ci-text'); if(ta && pid && step>=1 && step<=3) ans[pid][Q[step-1][0]] = ta.value.trim(); };
    const nx = document.getElementById('ci-next');
    if(nx) nx.addEventListener('click', async ()=>{ store(); if(step>=3) await save(); step++; paint(); });
    const bk = document.getElementById('ci-back');
    if(bk) bk.addEventListener('click', ()=>{ store(); step--; paint(); });
  }
}

/* ---- simulador ¿y si? ---- */
function netMonth(k, pid){
  let n=0;
  state.movimientos.forEach(m=>{
    if(monthKey(m.date)!==k) return;
    const mine = m.scope==='individual' ? m.profileId===pid : true;
    if(!mine) return;
    const w = m.scope==='conjunto' ? 0.5 : 1;
    if(m.type==='ingreso') n += m.amount*w; else if(m.type==='gasto') n -= m.amount*w;
  });
  return n;
}
function baselineNet(pid){
  const ks = monthKeysBack(4).slice(1,4);
  const v = ks.map(k=>netMonth(k,pid));
  return v.reduce((a,b)=>a+b,0)/(v.length||1);
}

      const X=i=>8+i*(284/11), Y=v=>112-(v-mn)/(mx-mn||1)*100;

        <polyline points="${pl(A)}" fill="none" stroke="var(--fg-muted, #888)" stroke-width="2" stroke-dasharray="4 3"/>
        <polyline points="${pl(B)}" fill="none" stroke="${diff>=0?'var(--good)':'var(--bad)'}" stroke-width="2.5"/></svg>
        <div class="stat-grid"><div class="stat-tile"><div class="label">Sin cambios (12 m)</div><div class="value num">${eur0(A[11])}</div></div>
