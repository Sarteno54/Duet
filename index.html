        <div class="card" style="padding:12px;text-align:center;margin-top:10px">Impacto a 12 meses: <b class="num" style="color:${diff>=0?'var(--good)':'var(--bad)'}">${diff>=0?'+':'−'}${eur0(Math.abs(diff))}</b></div>`;
    };
    document.querySelectorAll('[data-pre]').forEach(b=>b.addEventListener('click',()=>{
      const x=P.find(y=>y[0]===b.getAttribute('data-pre')); d.value=x[2]; o.value=x[3]; name=x[4]; calc();
    }));
    d.addEventListener('input',calc); o.addEventListener('input',calc); calc();
  });
}

/* ---- línea de tiempo ---- */
function timelineEvents(){
  const ev=[]; const mv=state.movimientos.slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(mv.length) ev.push({d:mv[0].date, e:'🌱', t:'Primer movimiento apuntado'});
  const sv=mv.filter(m=>m.type==='ahorro');
  if(sv.length) ev.push({d:sv[0].date, e:'🐷', t:'Primer ahorro'});
  let acc=0; const marks=[100,500,1000,2500,5000,10000], hit={};
  sv.forEach(m=>{ acc+=m.amount; marks.forEach(k=>{ if(!hit[k] && acc>=k){ hit[k]=1; ev.push({d:m.date, e:k>=1000?'💰':'✨', t:'Primeros '+fmtMoney(k)+' ahorrados'}); } }); });
  state.metas.forEach(g=>{
    let a=0; for(const m of sv.filter(x=>x.goalId===g.id)){ a+=m.amount; if(g.target>0 && a>=g.target){ ev.push({d:m.date, e:'🎯', t:'Meta cumplida: '+g.name}); break; } }
  });
  const trip=mv.find(m=>m.type==='gasto' && /viaje|vuelo|hotel|avi[oó]n|airbnb|booking|tren/i.test((m.note||'')+' '+(m.category||'')));
  if(trip) ev.push({d:trip.date, e:'✈️', t:'Primer viaje pagado'+(trip.note?' · '+trip.note:'')});
  const cita=mv.find(m=>m.type==='gasto' && m.category==='Citas'); if(cita) ev.push({d:cita.date, e:'🍷', t:'Primera cita apuntada'});
  const months={}; mv.forEach(m=>{ const k=monthKey(m.date); months[k]=(months[k]||0)+(m.type==='ingreso'?m.amount:m.type==='gasto'?-m.amount:0); });
  const pos=Object.keys(months).sort().find(k=>months[k]>0); if(pos) ev.push({d:pos+'-28', e:'📈', t:'Primer mes en positivo'});
  state.inversiones.slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).slice(0,1).forEach(i=>ev.push({d:new Date(i.createdAt||Date.now()).toISOString().slice(0,10), e:'📊', t:'Primera inversión: '+i.name}));
  state.presupuestos.filter(p=>p.kind==='cierre').forEach(c=>ev.push({d:(c.month||'')+'-28', e:'🤝', t:'Cierre de mes de '+monthLabelOf(c.month)}));
  return ev.sort((a,b)=>a.d.localeCompare(b.d));
}
function openTimelineSheet(){
  const ev=timelineEvents();
  const total = state.movimientos.filter(m=>m.type==='ahorro').reduce((a,m)=>a+m.amount,0);
  const next=[100,500,1000,2500,5000,10000,25000].find(k=>k>total);
  sheetShell('Vuestra línea de tiempo 🧭', `<div class="col" style="gap:0">
    ${ev.length?ev.map(x=>`<div class="tl-row"><div class="tl-dot">${x.e}</div><div><b style="font-size:14px">${escapeHtml(x.t)}</b><div class="faint" style="font-size:11.5px">${fmtDate(x.d)}</div></div></div>`).join(''):'<div class="empty">Aún no hay hitos. Apuntad movimientos y ahorrad.</div>'}
    ${next?`<div class="tl-row" style="opacity:.55"><div class="tl-dot">🔒</div><div><b style="font-size:14px">Próximo: ${fmtMoney(next)} ahorrados</b><div class="faint" style="font-size:11.5px">Os faltan ${fmtMoney(next-total)}</div></div></div>`:''}
  </div>`);
}

function citaRemaining(){
  const month=monthKey(todayISO());
  const key=['conjunto','Citas',month].join('__').replace(/[^a-zA-Z0-9_]/g,'-');
  const b=state.presupuestos.find(p=>p.id===key);
  const spent=state.movimientos.filter(m=>m.type==='gasto' && m.scope==='conjunto' && m.category==='Citas' && monthKey(m.date)===month).reduce((a,m)=>a+m.amount,0);
  return b && b.limit>0 ? {limit:b.limit, spent, left:Math.max(0,b.limit-spent)} : null;
}
function openCitaSheet(){

const INV_KINDS = {Acciones:'#60A5FA', ETF:'#34D399', Fondos:'#A78BFA', Cripto:'#F59E0B', Otro:'#9AA1AD'};
function invTotals(list){
  const inv = list.reduce((s,p)=>s+(p.invested||0),0);
  const val = list.reduce((s,p)=>s+(p.value||0),0);
  return {inv, val, pl:val-inv, pct: inv>0 ? (val-inv)/inv*100 : 0};
}
function fmtPct(n){ return (n>0?'+':'')+n.toFixed(1).replace('.',',')+'%'; }
function invRow(p){
  const pl = (p.value||0)-(p.invested||0);
  const pct = p.invested>0 ? pl/p.invested*100 : 0;
  const c = INV_KINDS[p.kind] || INV_KINDS.Otro;
  return `<div class="tx-row" data-inv-open="${p.id}" style="cursor:pointer">
    <div class="tx-icon" style="background:color-mix(in srgb, ${c} 20%, transparent); color:${c}">${icon('trend')}</div>

      <div class="tx-meta" style="color:${pl>=0?'var(--good)':'var(--bad)'};font-weight:700">${pl>=0?'+':''}${fmtMoney(pl)} · ${fmtPct(pct)}</div></div>
  </div>`;
}

/* ============================= LIBRE PARA GASTAR + ETIQUETAS ============================= */
function sumAmt(arr){ return arr.reduce((s,m)=>s+m.amount,0); }

function libreData(){
  const month = localToday().slice(0,7);
  const joint = state.movimientos.filter(m=>m.scope==='conjunto');
  const inM = joint.filter(m=>monthKey(m.date)===month);
  const income = sumAmt(inM.filter(m=>m.type==='ingreso'));
  const cfgDoc = state.presupuestos.find(p=>p.id==='libre__cfg');
  const manual = cfgDoc && cfgDoc.base>0 ? cfgDoc.base : 0;
  const base = manual>0 ? manual : income;
  const recs = state.recurrentes.filter(r=>r.active!==false && r.scope==='conjunto');
  const fixed = recs.reduce((s,r)=>s+r.amount,0) + sumAmt(inM.filter(m=>m.type==='gasto' && m.fixed && !m.recurrenteId));
  const saved = sumAmt(inM.filter(m=>m.type==='ahorro'));
  const free = base - fixed - saved;
  const varSpent = sumAmt(inM.filter(m=>m.type==='gasto' && !m.fixed));
  const left = free - varSpent;
  const now = new Date();
  const dim = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const daysLeft = dim - now.getDate() + 1;
  const wk0 = isoShift(-((now.getDay()+6)%7));
  const today = localToday();
  const weekSpent = sumAmt(joint.filter(m=>m.type==='gasto' && !m.fixed && m.date>=wk0 && m.date<=today));
  const weekAllow = Math.max(0, free)/dim*7;
  const weekLeft = Math.min(weekAllow - weekSpent, left);
  return {base, manual, income, fixed, nFixed:recs.length, saved, free, varSpent, left, daysLeft, weekSpent, weekAllow, weekLeft, perDay: Math.max(0,left)/Math.max(1,daysLeft)};
}

function renderLibre(){
  const d = libreData();
  const w = (state.libreView||'mes')==='semana';
  const seg = `<div class="qb-seg">
    <button type="button" data-libre-view="semana" class="${w?'active':''}">Semana</button>

        <button class="btn btn-primary" id="libre-edit">Fijar base mensual</button>
      </div>
    </section>`;

        <div class="libre-amt num" style="color:${color};margin-top:6px">${fmtMoney(amount)}</div>
        <div class="muted" style="font-size:12.5px;margin-top:4px">de ${fmtMoney(Math.max(0,total))} para ${w?'la semana':'el mes'} · gastado ${fmtMoney(spent)}</div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      ${d.left>0 ? `<div class="muted" style="font-size:12.5px">≈ ${fmtMoney(d.perDay)} al día durante los ${d.daysLeft} días que quedan de mes</div>` : ''}
      <div class="col" style="gap:0">

        ${line('Gastos fijos compartidos'+(d.nFixed?' ('+d.nFixed+')':''), d.fixed, '−', 'var(--bad)')}
        ${line('Ahorro y etiquetas', d.saved, '−', 'var(--accent-joint)')}
        ${line('Libre del mes', d.free, '', '', 'total')}
        ${line('Gastado en variables', d.varSpent, '−', 'var(--bad)')}

      </div>

/* ============================= SHEET (bottom modal) ============================= */
function closeSheet(){
  const host = document.getElementById('sheetHost');
  host.innerHTML='';
}
function openSheetWith(html, onMount){
  const host = document.getElementById('sheetHost');
  host.innerHTML = `<div class="sheet-backdrop" id="sheet-backdrop"><div class="sheet">
    <div class="sheet-handle"></div>${html}
  </div></div>`;
  document.getElementById('sheet-backdrop').addEventListener('click', (e)=>{
    if(e.target.id==='sheet-backdrop') closeSheet();
  });
  if(onMount) onMount();
}

/* ---- hoja de cuenta: Face ID, exportar/importar y cerrar sesión ---- */
function openAccountSheet(){
  const me = profileById(state.currentProfileId);
  if(!me){ render(); return; }
  paint();
  function paint(){ openSheetWith(bodyHtml(), wire); }
  function bodyHtml(){
    const faceOn = !!faceRegistered(me.id);
    return `
      <div class="spread sheet-title"><span>Tu cuenta</span>
        <button class="btn-ghost" id="sheet-close" style="padding:6px;border-radius:8px">${icon('close')}</button>
      </div>
      <div class="col" style="gap:12px">
        <div class="row card" style="gap:12px">
          <div class="avatar-lg" style="background:${profileColor(me)};color:${profileColor(me,true)}">${initials(me.name)}</div>
          <div style="flex:1">
            <div style="font-weight:700">${escapeHtml((identityOf(me)||{}).full || me.name)}</div>
            <div class="muted" style="font-size:12px">Sesión iniciada en este dispositivo</div>
          </div>
        </div>
        ${faceSupported() ? `<button class="btn btn-block" id="acct-face">${icon('face')} ${faceOn?'Desactivar Face ID':'Activar Face ID'}</button>` : ''}
        <button class="btn btn-block" id="acct-pin">${icon('lock')} Cambiar PIN</button>
        <button class="btn btn-block" id="acct-logout">${icon('logout')} Cerrar sesión</button>
        <button class="btn btn-block" id="acct-export">${icon('download')} Exportar a CSV</button>
        <button class="btn btn-block" id="acct-import">${icon('up')} Importar CSV del banco</button>
        <input type="file" id="acct-import-file" accept=".csv,text/csv" class="hidden">
        ${(state.cloudSource==='artifact' && FIREBASE_CONFIG.apiKey) ? `<button class="btn btn-block" id="acct-migrate">${icon('repeat')} Migrar a Firebase</button>` : ''}
      </div>`;
  }
  function wire(){
    const closeBtn = document.getElementById('sheet-close');
    if(closeBtn) closeBtn.addEventListener('click', closeSheet);
    document.getElementById('acct-pin').addEventListener('click', ()=>{
      openSheetWith(`<div class="spread sheet-title"><span>Cambiar PIN</span>
        <button class="btn-ghost" id="sheet-close" style="padding:6px;border-radius:8px">${icon('close')}</button></div>
        <div id="pin-sheet-root" style="padding-bottom:8px"></div>`, ()=>{
          document.getElementById('sheet-close').addEventListener('click', closeSheet);
          mountPinFlow(document.getElementById('pin-sheet-root'), {type:'change', profile:me, onSuccess:()=>{ closeSheet(); toast('PIN cambiado'); }});
        });
    });
    document.getElementById('acct-logout').addEventListener('click', ()=>{
      state.currentProfileId=null; state.alertSeen=null;
      try{ sessionStorage.removeItem('dc_profile'); }catch(e){}
      login.show=false;
      closeSheet(); render(); toast('Sesión cerrada');
    });
    const faceBtn = document.getElementById('acct-face');
    if(faceBtn) faceBtn.addEventListener('click', async ()=>{
      if(faceRegistered(me.id)){ faceDisable(me.id); try{ localStorage.setItem('dc_face_no_'+me.id,'1'); }catch(e){} toast('Face ID desactivado'); paint(); return; }
      try{ await faceRegister(me); try{ localStorage.removeItem('dc_face_no_'+me.id); }catch(e){} toast('Face ID activado'); paint(); }
      catch(e){ toast('No se pudo activar Face ID en este dispositivo'); }
    });
    document.getElementById('acct-export').addEventListener('click', exportCSV);
    const importBtn = document.getElementById('acct-import');
    const importFile = document.getElementById('acct-import-file');
    importBtn.addEventListener('click', ()=> importFile.click());
    importFile.addEventListener('change', async ()=>{
      const file = importFile.files[0];
      if(!file) return;
      try{
        const text = await file.text();
        const n = await importBankCSV(text);
        toast(n+' movimientos importados');
        closeSheet();
      }catch(e){ toast('No se pudo leer el CSV'); }
    });
    const migrateBtn = document.getElementById('acct-migrate');
    if(migrateBtn) migrateBtn.addEventListener('click', async ()=>{
      if(!confirm('Esto copiará todos los datos actuales a tu proyecto de Firebase. ¿Continuar?')) return;
      migrateBtn.disabled = true; migrateBtn.textContent = 'Migrando…';
      try{
        const n = await migrateToFirebase();
        toast(n+' registros migrados a Firebase');
        closeSheet();
      }catch(e){
        console.error(e);
        toast('Error al migrar: '+(e.message||'inténtalo de nuevo'));
        migrateBtn.disabled = false; migrateBtn.textContent = 'Migrar a Firebase';
      }
    });
  }
}

  const html = `
    <div class="spread sheet-title">

      ${scope==='conjunto' && type==='gasto' ? `<p class="muted" style="font-size:12px;margin:0">Se repartirá 50/50 por defecto. Usa el botón + para un reparto distinto.</p>` : ''}

        <div id="qa-photo-preview"></div>
      </div>
      <button class="btn btn-primary btn-block" id="qa-submit" style="padding:14px">Guardar ${type==='gasto'?'gasto':'ingreso'}</button>
    </div>`;
  openSheetWith(html, ()=>{
    document.getElementById('sheet-close').addEventListener('click', closeSheet);
    const amtEl = document.getElementById('qa-amount');
    setTimeout(()=>{ try{ amtEl.focus(); }catch(e){} }, 60);
    const photoEl = document.getElementById('qa-photo');
    photoEl.addEventListener('change', async ()=>{
      const file = photoEl.files[0];
      if(!file) return;
      try{ photo = await compressPhoto(file); document.getElementById('qa-photo-preview').innerHTML = `<img src="${photo}" style="width:72px;height:72px;object-fit:cover;border-radius:10px;margin-top:6px">`; }
      catch(e){ toast('No se pudo leer la foto'); }
    });
    document.getElementById('qa-submit').addEventListener('click', async ()=>{
      const amount = parseFloat(amtEl.value);
      if(!amount || amount<=0){ toast('Pon un importe válido'); return; }
      const note = document.getElementById('qa-note').value.trim();
      const other = state.profiles.find(p=>p.id!==me.id);
      let split = null;
      if(scope==='conjunto' && type==='gasto'){ split = {[me.id]: amount/2, [other?other.id:'x']: amount/2}; }

      closeSheet(); undoToast((type==='gasto'?'Gasto':'Ingreso')+' guardado', [nid]); render();
    });
  });
}

  let addPhoto = null;

      document.querySelectorAll('#f-cat-grid [data-cname]').forEach(b=>{

    function updateFixedVisibility(){
      document.getElementById('fixed-wrap').style.display = (type==='gasto') ? '' : 'none';

          `<button type="button" class="cat-chip" id="f-cat-new">

        });
        document.getElementById('f-cat-new').addEventListener('click', ()=>{ openCategorySheet(type); });
      }else{
        document.getElementById('f-cat-wrap').style.display='none';

        goalSel.innerHTML = '<option value="">Sin meta — ahorro general</option>' + relevantGoals.map(g=>`<option value="${g.id}">${escapeHtml(g.name)}</option>`).join('');

      }

      if(document.getElementById('sur-wrap')) updateSurVisibility();
    }
    function updateSplitVisibility(){
      document.getElementById('split-wrap').style.display = (scope==='conjunto') ? '' : 'none';
      updateSurVisibility();
    }
    function updateSurVisibility(){
      document.getElementById('sur-wrap').style.display = (scope==='conjunto' && type==='gasto') ? '' : 'none';
    }

    document.querySelectorAll('#type-seg button').forEach(b=>{

      });

    document.querySelectorAll('#split-chips .chip').forEach(c=>{

        document.getElementById('split-custom').style.display = splitMode==='custom' ? 'flex' : 'none';
      });
    });

    document.getElementById('f-submit').addEventListener('click', async ()=>{
      const amount = parseFloat(document.getElementById('f-amount').value);
      if(!amount || amount<=0){ toast('Pon un importe válido'); return; }
      const note = document.getElementById('f-note').value.trim();
      const date = document.getElementById('f-date').value || todayISO();
      const fixed = type==='gasto' ? (fixedMode==='fijo') : false;
      const other = state.profiles.find(p=>p.id!==me.id);

      let goalId=null, goalName=null, split=null;
      if(type==='ahorro'){
        goalId = goalSel.value || null;
        if(goalId){ const g = state.metas.find(x=>x.id===goalId); goalName = g ? g.name : null; }
      }
      if(scope==='conjunto' && type==='gasto'){
        if(splitMode==='50-50'){ split = {[me.id]: amount/2, [other?other.id:'x']: amount/2}; }
        else if(splitMode==='me'){ split = {[me.id]: amount, [other?other.id:'x']: 0}; }
        else if(splitMode==='other'){ split = {[me.id]: 0, [other?other.id:'x']: amount}; }
        else{
          const a = parseFloat(document.getElementById('split-me').value)||0;
          const b = parseFloat(document.getElementById('split-other').value)||0;
          split = {[me.id]: a, [other?other.id:'x']: b};
        }
      }
      const nid = await addMovimiento({type, scope, amount, category: (type==='ahorro'?null:category), note, date, fixed, profileId: me.id, split, goalId, goalName, receiptPhoto: addPhoto, surpriseUntil: (scope==='conjunto' && type==='gasto') ? (document.getElementById('f-sur').value || null) : null, tagId: (document.getElementById('f-tag')||{}).value || null});
      closeSheet(); undoToast('Movimiento guardado', [nid]); render();
    });
  });
}

async function updateMeta(id, patch){
  const m = state.metas.find(x=>x.id===id); if(m) Object.assign(m, patch);
  if(state.cloud){ await state.db.collection('metas').doc(id).update(patch); }
  render();
}

/* ---------- Gráfico de anillo (Chart.js) ---------- */
let catChart = null;
function cssColor(c){
  if(typeof c==='string' && c.startsWith('var(')){
    return getComputedStyle(document.documentElement).getPropertyValue(c.slice(4,-1)).trim() || '#9AA1AD';
  }
  return c;
}
function drawCatDonut(){
  if(catChart){ catChart.destroy(); catChart=null; }
  const sc = (window.__cat && window.__cat.scope) || 'individual';
  state.catOffset = state.catOffset || {individual:0, conjunto:0};
  const prev = document.getElementById('cat-prev'), next = document.getElementById('cat-next');
  if(prev) prev.onclick = ()=>{ state.catOffset[sc]--; render(); };
  if(next) next.onclick = ()=>{ if(state.catOffset[sc]<0){ state.catOffset[sc]++; render(); } };
  const cv = document.getElementById('cat-donut');
  if(!cv) return;
  if(typeof Chart==='undefined'){
    cv.parentElement.innerHTML = donutChart(window.__cat.raw);
    return;
  }
  const rows = window.__cat.rows;
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const fmt0 = n => n.toLocaleString('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0});
  const center = {
    id:'centerText',
    afterDraw(ch){
      const {ctx, chartArea:{left,right,top,bottom}} = ch;
      const x=(left+right)/2, y=(top+bottom)/2, r=(right-left)/2;
      const tot = ch.data.datasets[0].data.reduce((a,v,i)=>a+(ch.getDataVisibility(i)?v:0),0);
      ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle = css('--fg-muted'); ctx.font = '700 '+(r*.1)+'px "Public Sans",system-ui';
      ctx.fillText('GASTO DEL MES', x, y-r*.2);
      ctx.fillStyle = css('--fg'); ctx.font = '700 '+(r*.25)+'px "Bricolage Grotesque",system-ui';
      ctx.fillText(fmt0(tot), x, y+r*.07);
      ctx.restore();
    }
  };
  const sig = sc+'|'+(state.catOffset[sc]||0)+'|'+rows.map(r=>r.name+r.v.toFixed(2)).join(',');
  const animate = sig!==state.catSig; state.catSig = sig;
  catChart = new Chart(cv,{
    type:'doughnut',
    data:{labels:rows.map(r=>r.name), datasets:[{data:rows.map(r=>+r.v.toFixed(2)), backgroundColor:rows.map(r=>cssColor(r.color)), borderColor:css('--surface'), borderWidth:3, borderRadius:10, spacing:2, hoverOffset:10}]},
    options:{
      responsive:true, maintainAspectRatio:true, cutout:'74%',
      animation: animate ? {duration:700, easing:'easeOutQuart'} : false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>{
        const t=c.dataset.data.reduce((a,b)=>a+b,0);
        return ' '+fmtMoney(c.parsed)+' · '+(c.parsed/t*100).toFixed(1)+'%';
      }}}}
    },
    plugins:[center]
  });
  document.querySelectorAll('.cat-legend li').forEach(li=>{
    li.addEventListener('click', ()=>{
      catChart.toggleDataVisibility(+li.dataset.i);
      li.classList.toggle('off'); catChart.update();
    });
  });
}

/* ============================= FONDO LÍQUIDO ============================= */
/* El fondo es un gradiente líquido que refleja la salud del presupuesto del mes:
   frío y calmado al principio; cálido y agitado al acercarse al límite. */
function budgetStress(){
  const month = monthKey(todayISO());
  const me = state.currentProfileId;
  let limit=0, spent=0;
  state.presupuestos.forEach(p=>{
    if(p.month!==month || !(p.limit>0)) return;
    if(p.scope==='individual' && p.profileId!==me) return;
    limit += p.limit;
    spent += state.movimientos.filter(m=>m.type==='gasto' && m.category===p.category && monthKey(m.date)===month && m.scope===p.scope && (p.scope==='conjunto' || m.profileId===p.profileId)).reduce((a,m)=>a+m.amount,0);
  });
  let ratio;
  if(limit>0){ ratio = spent/limit; }
  else{
    const mine = state.movimientos.filter(m=>monthKey(m.date)===month && (m.scope==='conjunto' || m.profileId===me));
    const t = totals(mine);
    ratio = t.ingresos>0 ? t.gastos/t.ingresos : (t.gastos>0 ? 0.5 : 0.1);
  }
  const early = Math.min(1, new Date().getDate()/6);   // primeros días: siempre en calma
  return Math.max(0, Math.min(1, ratio*(0.55+0.45*early)));
}
const Liquid = (function(){
  const COLD = [[59,108,255],[31,209,192],[124,108,255],[56,189,248],[99,102,241]];
  const WARM = [[255,176,46],[255,106,61],[255,61,90],[251,146,60],[244,63,94]];
  const PH = [0, 1.7, 3.1, 4.4, 5.6];
  let cv, ctx, w=0, h=0, target=0.15, cur=0.15, t=0, last=0, raf=0, still=false;
  const lerp=(a,b,k)=>a+(b-a)*k;
  const smooth=(a,b,x)=>{ x=Math.max(0,Math.min(1,(x-a)/(b-a))); return x*x*(3-2*x); };
  function isLight(){
    return state.theme==='light' || (state.theme!=='dark' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
  }
  function resize(){
    if(!cv) return;
    w = Math.max(60, Math.ceil(innerWidth/4)); h = Math.max(120, Math.ceil(innerHeight/4));
    cv.width = w; cv.height = h;
  }
  function draw(){
    if(!ctx) return;
    ctx.clearRect(0,0,w,h);
    const s = cur, m = smooth(0.35, 0.92, s);
    const speed = 0.10 + s*1.0, amp = 0.10 + s*0.16, jit = s*s*0.05;
    const R = Math.max(w,h)*(0.62);
    const alpha = isLight() ? 0.42 : 0.62;
    for(let i=0;i<5;i++){
      const c = COLD[i].map((v,k)=>Math.round(lerp(v, WARM[i][k], m)));
      const p = PH[i];
      const x = w*(0.5 + Math.sin(t*speed*(0.7+i*0.13)+p)*(0.30+amp) + Math.sin(t*speed*3.1+p*2)*jit);
      const y = h*(0.12 + i*0.2 + Math.cos(t*speed*(0.6+i*0.11)+p*1.3)*(0.10+amp*0.6) + Math.cos(t*speed*2.7+p)*jit);
      const g = ctx.createRadialGradient(x,y,0,x,y,R*(0.55+0.12*Math.sin(t*speed+p)));
      g.addColorStop(0,'rgba('+c.join(',')+','+alpha+')');
      g.addColorStop(1,'rgba('+c.join(',')+',0)');
      ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    }
  }
  function frame(now){
    const dt = Math.min(0.05, (now-last)/1000 || 0.016); last = now;
    cur += (target-cur)*Math.min(1, dt*0.8);   // transición lenta entre estados
    const speed = 0.10 + cur*1.0;
    t += dt*(1+speed);
    draw();
    raf = requestAnimationFrame(frame);
  }
  return {
    init(){
      cv = document.getElementById('liquid'); if(!cv) return;
      ctx = cv.getContext('2d'); resize();
      addEventListener('resize', ()=>{ resize(); draw(); });
      still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(still){ cur = target; draw(); } else { last = performance.now(); raf = requestAnimationFrame(frame); }
    },
    set(v){ target = v; if(still){ cur = v; draw(); } },
    redraw(){ if(still) draw(); },
  };
})();
